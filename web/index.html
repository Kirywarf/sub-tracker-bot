<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StopPay  — Cyber-Apple Vision</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              black: '#030305',
              surface: '#0d0d12',
              glass: 'rgba(255, 255, 255, 0.06)',
              cyan: '#00f0ff',
              blue: '#2997ff',
              purple: '#bf5af2',
              pink: '#ff375f',
              green: '#30d158',
              orange: '#ff9f0a',
              yellow: '#ffd60a',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    
    html, body {
      background-color: #030305;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh;
    }

    input, button, select, textarea {
      font-size: 16px; /* Prevents mobile browser zoom */
    }

    /* Cyber Ambient Mesh Background */
    .ambient-aurora {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .aurora-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.38;
      mix-blend-mode: screen;
      will-change: transform;
    }
    .orb-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #00f0ff 0%, #2997ff 70%, transparent 100%);
      top: -60px;
      left: 10%;
      animation: auroraMove1 14s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, #bf5af2 0%, #ff375f 70%, transparent 100%);
      top: 30%;
      right: -80px;
      animation: auroraMove2 18s ease-in-out infinite alternate;
    }
    .orb-3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #30d158 0%, #00f0ff 80%, transparent 100%);
      bottom: 5%;
      left: -60px;
      animation: auroraMove3 16s ease-in-out infinite alternate;
    }

    @keyframes auroraMove1 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 80px) scale(1.18); }
      100% { transform: translate(-30px, 120px) scale(0.95); }
    }
    @keyframes auroraMove2 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-70px, -50px) scale(1.22); }
      100% { transform: translate(40px, 60px) scale(1); }
    }
    @keyframes auroraMove3 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(80px, -60px) scale(1.15); }
      100% { transform: translate(-40px, 40px) scale(0.9); }
    }

    /* Subtle Cyber Dot-Grid Overlay */
    .cyber-grid {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.65;
    }

    /* Particle Canvas */
    #particle-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 60;
    }

    /* VisionOS Liquid Glass Card */
    .glass-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.07) 0%, rgba(20, 20, 26, 0.75) 50%, rgba(10, 10, 14, 0.92) 100%);
      backdrop-filter: blur(32px) saturate(210%);
      -webkit-backdrop-filter: blur(32px) saturate(210%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7), inset 0 1px 1px 0 rgba(255, 255, 255, 0.3), inset 0 -1px 2px 0 rgba(0, 0, 0, 0.5);
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease;
      will-change: transform;
    }
    .glass-card:hover {
      border-color: rgba(0, 240, 255, 0.35);
      box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.8), 0 0 30px -8px rgba(0, 240, 255, 0.25), inset 0 1px 1px 0 rgba(255, 255, 255, 0.4);
    }

    /* Specular Glare Layer for 3D Tilt */
    .card-glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.35s ease;
      z-index: 10;
      mix-blend-mode: overlay;
    }

    /* VisionOS Header Bar */
    .glass-header {
      background: rgba(8, 8, 12, 0.75);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* VisionOS Floating Dock */
    .glass-dock {
      background: rgba(18, 18, 24, 0.78);
      backdrop-filter: blur(36px) saturate(220%);
      -webkit-backdrop-filter: blur(36px) saturate(220%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 25px rgba(41, 151, 255, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    /* Animated Holographic Core Ring */
    .holo-core {
      animation: holoRotate 20s linear infinite;
    }
    @keyframes holoRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .donut-slice {
      transition: stroke-dasharray 0.8s cubic-bezier(0.16, 1, 0.3, 1), stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      filter: drop-shadow(0 0 7px currentColor);
    }

    /* Dynamic Island Pill */
    #dynamic-toast {
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
    }
    #dynamic-toast.toast-hidden {
      transform: translate(-50%, -140%) scale(0.85);
      opacity: 0;
      pointer-events: none;
    }

    /* Sheet Modal */
    .sheet-modal {
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }
    .sheet-modal.hidden-sheet {
      transform: translateY(105%);
      opacity: 0;
      pointer-events: none;
    }

    /* Glowing Pulse Dot */
    .radar-pulse {
      position: relative;
    }
    .radar-pulse::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: inherit;
      opacity: 0.6;
      animation: radarPing 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes radarPing {
      75%, 100% {
        transform: scale(2.3);
        opacity: 0;
      }
    }

    /* Liquid Neon Toggle Switch */
    .cyber-toggle:checked + .cyber-toggle-track {
      background: linear-gradient(135deg, #30d158 0%, #00f0ff 100%);
      box-shadow: 0 0 15px rgba(48, 209, 88, 0.6);
    }
    .cyber-toggle:checked + .cyber-toggle-track .cyber-toggle-thumb {
      transform: translateX(20px);
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* Floating Dock Active Pill Indicator */
    .dock-pill {
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Neon Text Glow */
    .text-neon-cyan {
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
    }
    .text-neon-purple {
      text-shadow: 0 0 12px rgba(191, 90, 242, 0.6);
    }
    .text-neon-green {
      text-shadow: 0 0 12px rgba(48, 209, 88, 0.6);
    }
  </style>
</head>

<body class="min-h-screen bg-[#030305] text-[#f5f5f7] flex flex-col pb-32 overflow-x-hidden selection:bg-[#00f0ff] selection:text-black">

  <!-- Ambient Light Aurora -->
  <div class="ambient-aurora">
    <div class="aurora-orb orb-1"></div>
    <div class="aurora-orb orb-2"></div>
    <div class="aurora-orb orb-3"></div>
  </div>

  <!-- Cyber Dot Grid Overlay -->
  <div class="cyber-grid"></div>

  <!-- Interactive Cyber Particles Canvas -->
  <canvas id="particle-canvas"></canvas>

  <!-- VisionOS Dynamic Island Toast -->
  <div id="dynamic-toast" class="toast-hidden fixed top-3 left-1/2 -translate-x-1/2 z-50 flex items-center space-x-2.5 px-5 py-2.5 rounded-full bg-[#121218]/90 text-white border border-[#00f0ff]/40 shadow-[0_0_30px_rgba(0,240,255,0.3)] text-xs font-semibold">
    <span id="toast-icon" class="w-5 h-5 rounded-full bg-[#00f0ff]/20 text-[#00f0ff] flex items-center justify-center text-xs font-bold">✓</span>
    <span id="toast-message" class="tracking-wide">Успешно</span>
  </div>

  <!-- Top Navigation Bar (VisionOS Glass Header) -->
  <header class="sticky top-0 z-40 glass-header px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-white/20 to-white/5 border border-white/20 flex items-center justify-center shadow-[0_0_15px_rgba(255,255,255,0.15)]">
        <span class="text-base text-white leading-none"></span>
      </div>
      <div>
        <div class="text-sm font-extrabold tracking-tight text-white flex items-center space-x-1.5">
          <span class="bg-gradient-to-r from-white via-white to-white/70 bg-clip-text text-transparent">StopPay</span>
          <span class="text-[9px] font-black uppercase px-1.5 py-0.5 rounded-md bg-[#00f0ff]/20 text-[#00f0ff] border border-[#00f0ff]/30 tracking-wider">Vision</span>
        </div>
        <div id="user-badge" class="text-[11px] font-medium text-[#86868b] truncate max-w-[130px]">Личный кабинет</div>
      </div>
    </div>

    <!-- Header Actions: Sound Toggle + Currency Switcher -->
    <div class="flex items-center space-x-2">
      <!-- Sound FX Toggle -->
      <button onclick="toggleSound()" id="sound-toggle-btn" title="Звук интерфейса" class="w-8 h-8 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-center text-sm text-white/70 transition">
        <span id="sound-icon">🔊</span>
      </button>

      <!-- Currency Selector Segmented Glass Bar -->
      <div class="flex items-center bg-[#14141c]/80 p-0.5 rounded-xl border border-white/15 text-[11px] font-semibold shadow-inner">
        <button onclick="changeCurrency('RUB')" id="curr-btn-RUB" class="curr-pill px-2.5 py-1 rounded-lg transition bg-white/20 text-white shadow-[0_0_10px_rgba(255,255,255,0.2)]">₽</button>
        <button onclick="changeCurrency('BYN')" id="curr-btn-BYN" class="curr-pill px-2.5 py-1 rounded-lg transition text-white/50 hover:text-white">Br</button>
        <button onclick="changeCurrency('USD')" id="curr-btn-USD" class="curr-pill px-2.5 py-1 rounded-lg transition text-white/50 hover:text-white">$</button>
        <button onclick="changeCurrency('PLN')" id="curr-btn-PLN" class="curr-pill px-2.5 py-1 rounded-lg transition text-white/50 hover:text-white">zł</button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="relative z-10 flex-1 max-w-lg mx-auto w-full px-4 pt-4 space-y-4">

    <!-- TAB 1: ANALYTICS / OVERVIEW -->
    <section id="view-analytics" class="space-y-4">

      <!-- Holographic Donut Card (VisionOS Ring Widget) -->
      <div class="glass-card p-6 text-center relative group">
        <div class="card-glare"></div>

        <!-- Ambient Glow behind Donut -->
        <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-56 h-56 bg-gradient-to-br from-[#00f0ff]/20 via-[#bf5af2]/20 to-transparent rounded-full blur-3xl pointer-events-none"></div>

        <div class="relative z-10">
          <div class="flex items-center justify-between mb-3 px-1">
            <div class="text-[10px] font-extrabold text-[#86868b] tracking-[0.25em] uppercase">
              Г О Д О В О Й   Р А С Х О Д
            </div>
            <div class="flex items-center space-x-1 text-[10px] font-bold text-[#00f0ff] bg-[#00f0ff]/10 px-2 py-0.5 rounded-full border border-[#00f0ff]/30">
              <span class="w-1.5 h-1.5 rounded-full bg-[#00f0ff] radar-pulse"></span>
              <span>LIVE AI</span>
            </div>
          </div>

          <!-- SVG Donut Chart with Center Display & Orbiting Core -->
          <div class="relative w-52 h-52 mx-auto my-3 flex items-center justify-center">
            
            <!-- Orbiting Decorative Cyber Ring -->
            <div class="absolute inset-0 rounded-full border border-dashed border-white/10 holo-core pointer-events-none"></div>
            
            <svg viewBox="0 0 160 160" class="w-full h-full -rotate-90">
              <circle cx="80" cy="80" r="62" stroke="rgba(255, 255, 255, 0.05)" stroke-width="15" fill="none" />
              <g id="donut-segments"></g>
            </svg>

            <!-- Holographic Center Hub -->
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none px-2 text-center">
              <span id="chart-total-amount" class="text-3xl sm:text-4xl font-black text-white tracking-tight drop-shadow-[0_0_15px_rgba(255,255,255,0.4)]">
                0 ₽
              </span>
              <span id="chart-monthly-avg" class="text-xs text-[#00f0ff] mt-0.5 font-bold tracking-wide text-neon-cyan">
                ~0 ₽ / мес
              </span>
              <div id="chart-services-badge" class="mt-2 text-[10px] font-extrabold px-3 py-0.5 rounded-full bg-white/10 text-white border border-white/15 backdrop-blur-md">
                0 активных
              </div>
            </div>
          </div>

          <!-- Distribution breakdown pills -->
          <div id="services-breakdown" class="mt-5 pt-4 border-t border-white/10 grid grid-cols-2 gap-2 text-left text-xs">
          </div>
        </div>
      </div>

      <!-- Monthly Health/Activity Spend Bar Chart -->
      <div class="glass-card p-5 relative group">
        <div class="card-glare"></div>
        <div class="relative z-10">
          <div class="flex items-center justify-between mb-4">
            <div>
              <div class="text-[10px] font-extrabold text-[#86868b] tracking-widest uppercase">КАЛЕНДАРЬ ТРАТ</div>
              <div class="text-sm font-extrabold text-white">Прогноз списаний по месяцам</div>
            </div>
            <span class="text-xs font-bold text-[#30d158] bg-[#30d158]/15 border border-[#30d158]/30 px-2.5 py-0.5 rounded-full shadow-[0_0_10px_rgba(48,209,88,0.25)] flex items-center space-x-1">
              <span class="w-1.5 h-1.5 rounded-full bg-[#30d158] radar-pulse"></span>
              <span>Оптимально</span>
            </span>
          </div>

          <div id="monthly-bars" class="h-32 flex items-end justify-between gap-1.5 pt-4 pb-2 px-1">
          </div>
          <div class="flex justify-between text-[10px] text-[#86868b] font-bold px-1 mt-1 tracking-wider uppercase">
            <span>Янв</span><span>Фев</span><span>Мар</span><span>Апр</span><span>Май</span><span>Июн</span><span>Июл</span><span>Авг</span><span>Сен</span><span>Окт</span><span>Ноя</span><span>Дек</span>
          </div>
        </div>
      </div>

    </section>

    <!-- TAB 2: SUBSCRIPTIONS LIST -->
    <section id="view-subscriptions" class="hidden space-y-3">
      <div class="flex items-center justify-between px-1">
        <div>
          <div class="text-[10px] font-extrabold text-[#86868b] tracking-widest uppercase">ТЕРМИНАЛ</div>
          <h2 class="text-base font-extrabold text-white">Активные подписки</h2>
        </div>
        <button onclick="openAddModal(event)" class="flex items-center space-x-1.5 text-xs font-bold text-white bg-gradient-to-r from-[#00f0ff] to-[#0071e3] hover:opacity-90 px-4 py-2 rounded-full transition shadow-[0_0_15px_rgba(0,240,255,0.4)] active:scale-95">
          <span class="text-base leading-none">＋</span>
          <span>Добавить</span>
        </button>
      </div>

      <!-- Dynamic Subscriptions Container -->
      <div id="subs-list-container" class="space-y-3">
      </div>
    </section>

  </main>

  <!-- Bottom Floating Capsule Dock (VisionOS Style) -->
  <nav class="fixed bottom-4 inset-x-4 max-w-sm mx-auto z-40">
    <div class="glass-dock rounded-full p-1.5 shadow-2xl flex items-center justify-around relative">
      <button onclick="switchTab('analytics')" id="nav-analytics" class="dock-pill flex-1 flex flex-col items-center py-2 rounded-full transition text-white bg-white/15 font-bold shadow-[0_0_15px_rgba(255,255,255,0.15)]">
        <span class="text-lg leading-none">📊</span>
        <span class="text-[10px] mt-1 tracking-wider">Обзор</span>
      </button>

      <button onclick="switchTab('subscriptions')" id="nav-subscriptions" class="dock-pill flex-1 flex flex-col items-center py-2 rounded-full transition text-white/50 hover:text-white font-medium">
        <span class="text-lg leading-none">📋</span>
        <span class="text-[10px] mt-1 tracking-wider">Подписки</span>
      </button>

      <button onclick="openAddModal(event)" class="dock-pill flex-1 flex flex-col items-center py-2 rounded-full transition text-[#00f0ff] font-bold active:scale-95 hover:text-white">
        <span class="text-lg leading-none font-black">＋</span>
        <span class="text-[10px] mt-1 tracking-wider">Создать</span>
      </button>
    </div>
  </nav>

  <!-- Add Subscription Bottom Sheet Modal -->
  <div id="add-modal-overlay" onclick="closeAddModal(event)" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden opacity-0 transition-opacity duration-300">
    <div onclick="event.stopPropagation()" id="add-modal-content" class="sheet-modal hidden-sheet w-full max-w-md bg-[#101016] border-t sm:border border-white/20 rounded-t-3xl sm:rounded-3xl p-6 shadow-[0_0_60px_rgba(0,0,0,0.9)] space-y-4 max-h-[90vh] overflow-y-auto pb-12">
      
      <!-- Sheet Handle -->
      <div class="w-12 h-1.5 bg-white/30 rounded-full mx-auto sm:hidden mb-2"></div>

      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span class="text-lg">✨</span>
          <h3 class="text-base font-extrabold text-white">Новая подписка</h3>
        </div>
        <button type="button" onclick="closeAddModal()" class="w-8 h-8 rounded-full bg-white/10 text-white/70 hover:text-white flex items-center justify-center text-sm transition">✕</button>
      </div>

      <!-- Quick Preset Chips -->
      <div>
        <div class="text-[10px] text-[#86868b] uppercase font-extrabold tracking-widest mb-2.5">Быстрые пресеты</div>
        <div class="flex flex-wrap gap-1.5">
          <button type="button" onclick="applyPreset('Яндекс Плюс', 299, 'RUB', 30, 'https://plus.yandex.ru', event)" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition active:scale-95">Яндекс Плюс</button>
          <button type="button" onclick="applyPreset('Telegram Premium', 399, 'RUB', 30, 'https://telegram.org', event)" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition active:scale-95">TG Premium</button>
          <button type="button" onclick="applyPreset('Spotify', 19.99, 'PLN', 30, 'https://spotify.com/account', event)" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition active:scale-95">Spotify</button>
          <button type="button" onclick="applyPreset('Netflix', 14.99, 'USD', 30, 'https://netflix.com/cancel', event)" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition active:scale-95">Netflix</button>
          <button type="button" onclick="applyPreset('YouTube Premium', 13.99, 'USD', 30, 'https://youtube.com/paid_memberships', event)" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition active:scale-95">YouTube</button>
          <button type="button" onclick="applyPreset('iCloud+', 149, 'RUB', 30, 'https://appleid.apple.com', event)" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition active:scale-95">iCloud+</button>
        </div>
      </div>

      <!-- Form with Smooth Keyboard Support -->
      <form id="add-sub-form" onsubmit="submitNewSub(event)" class="space-y-4">
        
        <!-- Service Name -->
        <div>
          <label class="block text-[11px] text-[#86868b] uppercase font-bold tracking-wider mb-1.5">Название сервиса</label>
          <input type="text" id="form-name" required placeholder="Например: Netflix, Кинопоиск..." class="w-full bg-[#161620] border border-white/15 rounded-xl px-3.5 py-2.5 text-base text-white placeholder-white/25 focus:outline-none focus:border-[#00f0ff] focus:ring-1 focus:ring-[#00f0ff] transition">
        </div>

        <!-- Price and Currency Row -->
        <div class="grid grid-cols-2 gap-3 items-end">
          <div>
            <label class="block text-[11px] text-[#86868b] uppercase font-bold tracking-wider mb-1.5">Стоимость</label>
            <input type="text" inputmode="decimal" id="form-price" required placeholder="299" class="w-full bg-[#161620] border border-white/15 rounded-xl px-3.5 py-2.5 text-base text-white placeholder-white/25 focus:outline-none focus:border-[#00f0ff] focus:ring-1 focus:ring-[#00f0ff] transition">
          </div>

          <div>
            <label class="block text-[11px] text-[#86868b] uppercase font-bold tracking-wider mb-1.5">Валюта</label>
            <div class="grid grid-cols-4 gap-1 bg-[#161620] border border-white/15 p-1 rounded-xl">
              <button type="button" onclick="setFormCurrency('RUB')" id="f-curr-RUB" class="form-curr-pill py-1.5 rounded-lg text-xs font-bold transition bg-gradient-to-r from-[#00f0ff] to-[#0071e3] text-black">₽</button>
              <button type="button" onclick="setFormCurrency('BYN')" id="f-curr-BYN" class="form-curr-pill py-1.5 rounded-lg text-xs font-medium transition text-white/60 hover:text-white">Br</button>
              <button type="button" onclick="setFormCurrency('USD')" id="f-curr-USD" class="form-curr-pill py-1.5 rounded-lg text-xs font-medium transition text-white/60 hover:text-white">$</button>
              <button type="button" onclick="setFormCurrency('PLN')" id="f-curr-PLN" class="form-curr-pill py-1.5 rounded-lg text-xs font-medium transition text-white/60 hover:text-white">zł</button>
            </div>
            <input type="hidden" id="form-currency" value="RUB">
          </div>
        </div>

        <!-- Period Row with Direct Keyboard Input and Quick Buttons -->
        <div>
          <label class="block text-[11px] text-[#86868b] uppercase font-bold tracking-wider mb-1.5">Период списания (дней)</label>
          <div class="flex items-center space-x-2">
            <input type="number" id="form-period" value="30" min="1" max="3650" required class="w-28 bg-[#161620] border border-white/15 rounded-xl px-3 py-2 text-center text-base text-white focus:outline-none focus:border-[#00f0ff] transition">
            <div class="flex-1 flex gap-1.5">
              <button type="button" onclick="setFormPeriod(30)" class="flex-1 py-2 text-xs rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 text-white font-medium transition">30 дн.</button>
              <button type="button" onclick="setFormPeriod(365)" class="flex-1 py-2 text-xs rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 text-white font-medium transition">1 год</button>
              <button type="button" onclick="setFormPeriod(7)" class="flex-1 py-2 text-xs rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 text-white font-medium transition">7 дн.</button>
            </div>
          </div>
        </div>

        <!-- Next Billing Date with Quick Buttons -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-[11px] text-[#86868b] uppercase font-bold tracking-wider">Дата списания</label>
            <div class="flex space-x-2">
              <button type="button" onclick="setOffsetDate(0)" class="text-[11px] text-[#00f0ff] hover:underline">Сегодня</button>
              <button type="button" onclick="setOffsetDate(30)" class="text-[11px] text-[#00f0ff] hover:underline">+30 дн.</button>
              <button type="button" onclick="setOffsetDate(365)" class="text-[11px] text-[#00f0ff] hover:underline">+1 год</button>
            </div>
          </div>
          <input type="date" id="form-date" required class="w-full bg-[#161620] border border-white/15 rounded-xl px-3.5 py-2.5 text-base text-white focus:outline-none focus:border-[#00f0ff] transition cursor-pointer">
        </div>

        <!-- Cancellation URL -->
        <div>
          <label class="block text-[11px] text-[#86868b] uppercase font-bold tracking-wider mb-1.5">Ссылка на отмену (опционально)</label>
          <input type="url" id="form-url" placeholder="https://service.com/cancel" class="w-full bg-[#161620] border border-white/15 rounded-xl px-3.5 py-2.5 text-base text-white placeholder-white/25 focus:outline-none focus:border-[#00f0ff] transition">
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-[#00f0ff] via-[#2997ff] to-[#bf5af2] hover:opacity-95 text-black font-extrabold py-3.5 rounded-xl transition text-base flex items-center justify-center space-x-2 mt-2 shadow-[0_0_25px_rgba(0,240,255,0.4)] active:scale-[0.99]">
          <span>Сохранить в StopPay</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    // State
    const state = {
      user_id: null,
      first_name: '',
      currency: 'RUB',
      activeTab: 'analytics',
      subscriptions: [],
      metrics: null
    };

    const APPLE_COLORS = ['#00f0ff', '#bf5af2', '#30d158', '#ff9f0a', '#ff375f', '#ffd60a', '#2997ff', '#64d2ff'];
    const CURRENCY_SYMBOLS = { RUB: '₽', BYN: 'Br', USD: '$', PLN: 'zł' };

    const tg = window.Telegram?.WebApp;

    // Web Audio Synthesizer Engine (Zero-dependency futuristic cyber sound FX)
    const AudioFX = {
      ctx: null,
      enabled: true,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      click() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(2400, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.035);
          gain.gain.setValueAtTime(0.07, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.035);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch(e) {}
      },
      chime() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const chords = [1046.5, 1318.5, 1567.98, 2093.0]; // C6, E6, G6, C7
          chords.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            const t = this.ctx.currentTime + idx * 0.055;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.05, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.45);
          });
        } catch(e) {}
      },
      thud() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + 0.09);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.1);
        } catch(e) {}
      }
    };

    function toggleSound() {
      AudioFX.enabled = !AudioFX.enabled;
      document.getElementById('sound-icon').innerText = AudioFX.enabled ? '🔊' : '🔇';
      if (AudioFX.enabled) {
        AudioFX.click();
        showToast('Звуковые эффекты включены');
      } else {
        showToast('Звуковые эффекты отключены');
      }
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    // Cyber Particle System
    class CyberParticleSystem {
      constructor() {
        this.canvas = document.getElementById('particle-canvas');
        if (!this.canvas) return;
        this.ctx = this.canvas.getContext('2d');
        this.particles = [];
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
      }
      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }
      burst(x, y, color = '#00f0ff', count = 30) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 7;
          this.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1.5,
            size: 2.5 + Math.random() * 3.5,
            color,
            alpha: 1,
            decay: 0.02 + Math.random() * 0.03,
            gravity: 0.14
          });
        }
      }
      loop() {
        if (this.particles.length > 0) {
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
          for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.alpha -= p.decay;
            p.size *= 0.96;

            if (p.alpha <= 0 || p.size <= 0.2) {
              this.particles.splice(i, 1);
              continue;
            }

            this.ctx.save();
            this.ctx.globalAlpha = p.alpha;
            this.ctx.shadowColor = p.color;
            this.ctx.shadowBlur = 12;
            this.ctx.fillStyle = p.color;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.restore();
          }
        }
        requestAnimationFrame(this.loop);
      }
    }

    let particleSystem = null;

    // 3D Tilt with Specular Glare Tracking
    function attach3DTilt(card) {
      if (!card || card.dataset.tiltAttached) return;
      card.dataset.tiltAttached = 'true';

      let glare = card.querySelector('.card-glare');
      if (!glare) {
        glare = document.createElement('div');
        glare.className = 'card-glare';
        card.appendChild(glare);
      }

      function handleMove(e) {
        const rect = card.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const dx = (x - cx) / cx;
        const dy = (y - cy) / cy;

        card.style.transform = `perspective(1000px) rotateX(${-dy * 8}deg) rotateY(${dx * 8}deg) translateZ(4px)`;
        glare.style.opacity = '1';
        glare.style.background = `radial-gradient(circle 140px at ${x}px ${y}px, rgba(255,255,255,0.22), transparent 75%)`;
      }

      function handleLeave() {
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
        glare.style.opacity = '0';
      }

      card.addEventListener('mousemove', handleMove, { passive: true });
      card.addEventListener('touchmove', handleMove, { passive: true });
      card.addEventListener('mouseleave', handleLeave);
      card.addEventListener('touchend', handleLeave);
      card.addEventListener('touchcancel', handleLeave);
    }

    function resolveUser() {
      // 1. Telegram WebApp SDK initDataUnsafe
      if (tg?.initDataUnsafe?.user?.id) {
        state.user_id = tg.initDataUnsafe.user.id;
        state.first_name = tg.initDataUnsafe.user.first_name || '';
        return;
      }

      // 2. Raw initData query string
      if (tg?.initData) {
        try {
          const p = new URLSearchParams(tg.initData);
          const uStr = p.get('user');
          if (uStr) {
            const u = JSON.parse(uStr);
            if (u.id) {
              state.user_id = u.id;
              state.first_name = u.first_name || '';
              return;
            }
          }
        } catch(e) {}
      }

      // 3. Telegram WebApp hash (#tgWebAppData=...)
      if (window.location.hash) {
        try {
          const hashParams = new URLSearchParams(window.location.hash.substring(1));
          const tgData = hashParams.get('tgWebAppData');
          if (tgData) {
            const inner = new URLSearchParams(tgData);
            const uStr = inner.get('user');
            if (uStr) {
              const u = JSON.parse(uStr);
              if (u.id) {
                state.user_id = u.id;
                state.first_name = u.first_name || '';
                return;
              }
            }
          }
        } catch(e) {}
      }

      // 4. URL query parameters ?user_id=...&name=...
      const urlParams = new URLSearchParams(window.location.search);
      const urlId = urlParams.get('user_id');
      if (urlId && !isNaN(parseInt(urlId))) {
        state.user_id = parseInt(urlId);
        const urlName = urlParams.get('name');
        if (urlName) state.first_name = decodeURIComponent(urlName);
        return;
      }

      // 5. Saved in localStorage
      const stored = localStorage.getItem('stoppay_user_id');
      if (stored && !isNaN(parseInt(stored))) {
        state.user_id = parseInt(stored);
        const storedName = localStorage.getItem('stoppay_user_name');
        if (storedName) state.first_name = storedName;
        return;
      }
    }

    function initApp() {
      particleSystem = new CyberParticleSystem();

      if (tg) {
        try {
          tg.ready();
          tg.expand();
          tg.setHeaderColor('#08080c');
          tg.setBackgroundColor('#030305');
          tg.enableClosingConfirmation();
        } catch(e) {}
      }

      resolveUser();

      if (state.user_id) {
        localStorage.setItem('stoppay_user_id', state.user_id);
        if (state.first_name) localStorage.setItem('stoppay_user_name', state.first_name);
      }

      updateUserBadge();
      setOffsetDate(30);

      // Attach 3D tilt to all static glass cards
      document.querySelectorAll('.glass-card').forEach(attach3DTilt);

      loadData();
    }

    function updateUserBadge() {
      const badge = document.getElementById('user-badge');
      if (state.first_name) {
        badge.innerText = state.first_name;
      } else {
        badge.innerText = 'Личный кабинет';
      }
    }

    // VisionOS Dynamic Island Toast Helper
    function showToast(msg, icon = '✓') {
      const toast = document.getElementById('dynamic-toast');
      document.getElementById('toast-message').innerText = msg;
      document.getElementById('toast-icon').innerText = icon;
      toast.classList.remove('toast-hidden');

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }

      setTimeout(() => {
        toast.classList.add('toast-hidden');
      }, 2500);
    }

    // Tab Switching with VisionOS Spring Physics
    function switchTab(tab) {
      AudioFX.click();
      state.activeTab = tab;
      const vAnalytics = document.getElementById('view-analytics');
      const vSubs = document.getElementById('view-subscriptions');
      const nAnalytics = document.getElementById('nav-analytics');
      const nSubs = document.getElementById('nav-subscriptions');

      if (tab === 'analytics') {
        vAnalytics.classList.remove('hidden');
        vSubs.classList.add('hidden');
        nAnalytics.className = 'dock-pill flex-1 flex flex-col items-center py-2 rounded-full transition text-white bg-white/15 font-bold shadow-[0_0_15px_rgba(255,255,255,0.15)]';
        nSubs.className = 'dock-pill flex-1 flex flex-col items-center py-2 rounded-full transition text-white/50 hover:text-white font-medium';
      } else {
        vAnalytics.classList.add('hidden');
        vSubs.classList.remove('hidden');
        nSubs.className = 'dock-pill flex-1 flex flex-col items-center py-2 rounded-full transition text-white bg-white/15 font-bold shadow-[0_0_15px_rgba(255,255,255,0.15)]';
        nAnalytics.className = 'dock-pill flex-1 flex flex-col items-center py-2 rounded-full transition text-white/50 hover:text-white font-medium';
      }

      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    // Currency Switch with Cyber Glow
    function changeCurrency(curr) {
      AudioFX.click();
      state.currency = curr;
      document.querySelectorAll('.curr-pill').forEach(btn => {
        btn.className = 'curr-pill px-2.5 py-1 rounded-lg transition text-white/50 hover:text-white';
      });
      const activeBtn = document.getElementById('curr-btn-' + curr);
      if (activeBtn) {
        activeBtn.className = 'curr-pill px-2.5 py-1 rounded-lg transition bg-white/20 text-white shadow-[0_0_10px_rgba(255,255,255,0.2)] font-bold';
      }
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      loadData();
    }

    // Fetch data from real backend REST API
    async function loadData() {
      try {
        let url = `/api/subscriptions?currency=${state.currency}`;
        if (state.user_id) {
          url += `&user_id=${state.user_id}`;
        }
        const res = await fetch(url);
        const data = await res.json();

        if (data.status === 'ok') {
          if (data.user_id && !state.user_id) {
            state.user_id = data.user_id;
            localStorage.setItem('stoppay_user_id', data.user_id);
          }
          state.subscriptions = data.subscriptions || [];
          state.metrics = data.metrics || null;
          updateUserBadge();
          renderUI();
        }
      } catch (e) {
        console.error('Error fetching subscriptions:', e);
      }
    }

    function renderUI() {
      renderDonutChart();
      renderMonthlyBars();
      renderSubscriptionsList();
    }

    function fmt(num) {
      return Math.round(num).toLocaleString('ru-RU');
    }

    // Smooth Number Animator
    function animateCounter(el, startVal, endVal, suffix = '') {
      const startTime = performance.now();
      const diff = endVal - startVal;
      const duration = 600;
      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(startVal + diff * ease);
        el.innerText = `${fmt(current)}${suffix}`;
        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          el.innerText = `${fmt(endVal)}${suffix}`;
        }
      }
      requestAnimationFrame(step);
    }

    let prevTotal = 0;
    let prevMonthly = 0;

    function renderDonutChart() {
      const sym = CURRENCY_SYMBOLS[state.currency] || state.currency;
      const g = document.getElementById('donut-segments');
      const breakdownEl = document.getElementById('services-breakdown');
      g.innerHTML = '';
      breakdownEl.innerHTML = '';

      const totalEl = document.getElementById('chart-total-amount');
      const monthlyEl = document.getElementById('chart-monthly-avg');
      const badgeEl = document.getElementById('chart-services-badge');

      if (!state.metrics || state.metrics.services_count === 0) {
        totalEl.innerText = `0 ${sym}`;
        monthlyEl.innerText = `~0 ${sym} / мес`;
        badgeEl.innerText = '0 активных';
        breakdownEl.innerHTML = '<div class="col-span-2 text-center text-[#86868b] py-3 text-xs">Нет активных подписок</div>';
        prevTotal = 0;
        prevMonthly = 0;
        return;
      }

      const total = state.metrics.total_annual;
      const monthly = state.metrics.monthly_avg;
      const count = state.metrics.services_count;
      const services = state.metrics.services;

      animateCounter(totalEl, prevTotal, total, ` ${sym}`);
      animateCounter(monthlyEl, prevMonthly, monthly, ` ${sym} / мес`);
      prevTotal = total;
      prevMonthly = monthly;

      badgeEl.innerText = `${count} ${pluralizeSubs(count)}`;

      const r = 62;
      const circumference = 2 * Math.PI * r;
      let currentOffset = 0;

      services.forEach((s, idx) => {
        const color = APPLE_COLORS[idx % APPLE_COLORS.length];
        const fraction = total > 0 ? (s.annual_cost / total) : 0;
        const dashLength = fraction * circumference;
        const gapLength = circumference - dashLength;
        const pct = Math.round(fraction * 100);

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', '80');
        circle.setAttribute('cy', '80');
        circle.setAttribute('r', r.toString());
        circle.setAttribute('stroke', color);
        circle.setAttribute('stroke-width', '15');
        circle.setAttribute('fill', 'none');
        circle.setAttribute('stroke-dasharray', `${dashLength} ${gapLength}`);
        circle.setAttribute('stroke-dashoffset', (-currentOffset).toString());
        circle.setAttribute('class', 'donut-slice');
        circle.style.color = color;
        g.appendChild(circle);

        currentOffset += dashLength;

        const pill = document.createElement('div');
        pill.className = 'flex items-center space-x-2.5 bg-white/[0.04] p-2.5 rounded-2xl border border-white/[0.06] hover:border-white/20 transition backdrop-blur-md';
        pill.innerHTML = `
          <span class="w-3 h-3 rounded-full flex-shrink-0 shadow-[0_0_8px_currentColor]" style="background-color: ${color}; color: ${color}"></span>
          <div class="truncate flex-1">
            <div class="text-white font-bold truncate text-xs">${s.name}</div>
            <div class="text-[10px] text-[#86868b] font-medium">${fmt(s.annual_cost)} ${sym}/год (${pct}%)</div>
          </div>
        `;
        breakdownEl.appendChild(pill);
      });
    }

    function pluralizeSubs(n) {
      if (n % 10 === 1 && n % 100 !== 11) return 'активная';
      return 'активных';
    }

    function renderMonthlyBars() {
      const container = document.getElementById('monthly-bars');
      container.innerHTML = '';
      const sym = CURRENCY_SYMBOLS[state.currency] || state.currency;
      const baseMonthly = state.metrics ? state.metrics.monthly_avg : 0;
      const currentMonth = new Date().getMonth();

      for (let m = 0; m < 12; m++) {
        const isCurrent = m === currentMonth;
        const factor = baseMonthly > 0 ? (0.92 + ((m * 3) % 17) / 100) : 0.05;
        const val = baseMonthly * factor;
        const heightPct = baseMonthly > 0 ? Math.min(100, Math.max(16, (factor / 1.1) * 92)) : 10;

        const col = document.createElement('div');
        col.className = 'flex-1 h-full flex items-end justify-center group relative cursor-pointer';
        
        const barGradient = isCurrent
          ? 'bg-gradient-to-t from-[#0071e3] to-[#00f0ff] shadow-[0_0_18px_rgba(0,240,255,0.7)]'
          : 'bg-white/10 hover:bg-white/25';

        col.innerHTML = `
          <div class="w-full ${barGradient} rounded-full transition-all duration-500" style="height: ${heightPct}%"></div>
          <div class="absolute -top-8 opacity-0 group-hover:opacity-100 transition-opacity bg-[#14141c] text-white text-[10px] font-bold px-2 py-1 rounded-lg border border-[#00f0ff]/40 shadow-[0_0_12px_rgba(0,240,255,0.4)] pointer-events-none whitespace-nowrap z-20">
            ${fmt(val)} ${sym}
          </div>
        `;

        col.addEventListener('click', () => {
          AudioFX.click();
          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        container.appendChild(col);
      }
    }

    function renderSubscriptionsList() {
      const container = document.getElementById('subs-list-container');
      container.innerHTML = '';

      if (state.subscriptions.length === 0) {
        container.innerHTML = `
          <div class="glass-card p-8 text-center space-y-3">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-[#00f0ff]/10 border border-[#00f0ff]/30 flex items-center justify-center text-2xl shadow-[0_0_20px_rgba(0,240,255,0.2)]">
              💳
            </div>
            <div class="text-sm font-extrabold text-white">Список подписок пуст</div>
            <div class="text-xs text-[#86868b] max-w-xs mx-auto leading-relaxed">Добавьте ваши регулярные сервисы, чтобы бот предупреждал о списаниях за 24 часа.</div>
            <button onclick="openAddModal(event)" class="bg-gradient-to-r from-[#00f0ff] to-[#0071e3] text-black text-xs px-5 py-2.5 rounded-full font-extrabold transition mt-2 shadow-[0_0_20px_rgba(0,240,255,0.4)] active:scale-95">
              ＋ Добавить первую подписку
            </button>
          </div>
        `;
        return;
      }

      state.subscriptions.forEach((sub, i) => {
        const sym = CURRENCY_SYMBOLS[sub.currency] || sub.currency;
        const isActive = sub.is_active;
        const card = document.createElement('div');
        card.className = `glass-card p-4 transition ${isActive ? '' : 'opacity-55'}`;

        let daysNotice = '';
        if (sub.next_billing_date) {
          const bDate = new Date(sub.next_billing_date);
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          bDate.setHours(0, 0, 0, 0);
          const diffDays = Math.round((bDate - today) / (1000 * 60 * 60 * 24));

          const dateStr = bDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
          if (diffDays < 0) {
            daysNotice = `<span class="text-[#ff453a] font-bold">${dateStr} (просрочено)</span>`;
          } else if (diffDays === 0) {
            daysNotice = `<span class="text-[#ffd60a] font-black drop-shadow-[0_0_8px_rgba(255,214,10,0.8)] animate-pulse">Сегодня!</span>`;
          } else if (diffDays <= 3) {
            daysNotice = `<span class="text-[#ff9f0a] font-bold">${dateStr} (через ${diffDays} дн.)</span>`;
          } else {
            daysNotice = `<span class="text-[#86868b] font-medium">${dateStr} (через ${diffDays} дн.)</span>`;
          }
        }

        const cancelBtn = sub.cancel_url
          ? `<a href="${sub.cancel_url}" target="_blank" onclick="event.stopPropagation()" class="text-[11px] text-[#00f0ff] hover:underline flex items-center space-x-0.5 bg-[#00f0ff]/10 px-2 py-0.5 rounded-md border border-[#00f0ff]/30 font-semibold"><span>↗ Отменить</span></a>`
          : '';

        const brandColor = APPLE_COLORS[i % APPLE_COLORS.length];

        card.innerHTML = `
          <div class="card-glare"></div>
          <div class="relative z-10 flex items-center justify-between">
            <div class="flex items-center space-x-3 truncate">
              
              <!-- Crystal Icon Badge with Brand Glow -->
              <div class="w-11 h-11 rounded-2xl bg-white/5 border border-white/15 flex items-center justify-center text-base font-black text-white flex-shrink-0 relative shadow-[0_0_15px_rgba(255,255,255,0.08)]" style="box-shadow: 0 0 15px ${brandColor}33; border-color: ${brandColor}66">
                <span style="color: ${brandColor}">${sub.service_name.charAt(0).toUpperCase()}</span>
                ${isActive ? `<span class="w-2 h-2 rounded-full absolute -top-1 -right-1 radar-pulse" style="background-color: #30d158"></span>` : ''}
              </div>

              <div class="truncate">
                <div class="text-sm font-extrabold text-white truncate flex items-center space-x-2">
                  <span>${sub.service_name}</span>
                  ${sub.cancel_url ? cancelBtn : ''}
                </div>
                <div class="text-[11px] mt-0.5">
                  ${daysNotice}
                </div>
              </div>
            </div>

            <div class="flex items-center space-x-3 flex-shrink-0">
              <div class="text-right">
                <div class="text-sm font-black text-white">${sub.price} ${sym}</div>
                <div class="text-[10px] text-[#86868b] font-bold">${sub.period_days} дн.</div>
              </div>

              <!-- Cyber Neon Switch -->
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" ${isActive ? 'checked' : ''} onchange="toggleSub(${sub.id}, this, event)" class="sr-only cyber-toggle">
                <div class="cyber-toggle-track w-11 h-6 bg-[#202028] rounded-full transition-all duration-300 relative border border-white/10">
                  <div class="cyber-toggle-thumb absolute top-[2px] left-[2px] bg-white/80 rounded-full h-5 w-5 transition-all duration-300"></div>
                </div>
              </label>

              <button onclick="deleteSub(${sub.id}, event)" class="w-8 h-8 rounded-full bg-white/5 hover:bg-[#ff453a]/25 text-[#86868b] hover:text-[#ff453a] flex items-center justify-center transition text-xs border border-white/5 active:scale-90">
                ✕
              </button>
            </div>
          </div>
        `;

        attach3DTilt(card);
        container.appendChild(card);
      });
    }

    async function toggleSub(subId, checkbox, event) {
      AudioFX.thud();
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      if (checkbox.checked && particleSystem && event) {
        const x = event.clientX || window.innerWidth / 2;
        const y = event.clientY || window.innerHeight / 2;
        particleSystem.burst(x, y, '#30d158', 25);
      }

      const sub = state.subscriptions.find(s => s.id === subId);
      if (sub) {
        sub.is_active = checkbox.checked;
        showToast(checkbox.checked ? 'Подписка активирована' : 'Подписка на паузе');
      }

      try {
        const res = await fetch(`/api/subscriptions/${subId}/toggle`, { method: 'POST' });
        const resData = await res.json();
        if (resData.status === 'ok') {
          loadData();
        }
      } catch (e) {
        console.error('Failed to toggle:', e);
      }
    }

    async function deleteSub(subId, event) {
      AudioFX.thud();
      if (!confirm('Удалить эту подписку?')) return;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');

      if (particleSystem && event) {
        const x = event.clientX || window.innerWidth / 2;
        const y = event.clientY || window.innerHeight / 2;
        particleSystem.burst(x, y, '#ff453a', 30);
      }

      try {
        await fetch(`/api/subscriptions/${subId}`, { method: 'DELETE' });
        showToast('Подписка удалена', '✕');
        loadData();
      } catch (e) {
        console.error('Failed to delete:', e);
      }
    }

    // Modal Sheet Handlers
    function openAddModal(event) {
      AudioFX.click();
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

      if (particleSystem && event) {
        const x = event.clientX || window.innerWidth / 2;
        const y = event.clientY || window.innerHeight / 2;
        particleSystem.burst(x, y, '#00f0ff', 18);
      }

      const overlay = document.getElementById('add-modal-overlay');
      const content = document.getElementById('add-modal-content');
      overlay.classList.remove('hidden');
      setTimeout(() => {
        overlay.classList.remove('opacity-0');
        content.classList.remove('hidden-sheet');
        document.getElementById('form-name').focus();
      }, 10);
    }

    function closeAddModal(e) {
      if (e && e.target !== e.currentTarget && e.target.tagName !== 'BUTTON') return;
      AudioFX.click();
      const overlay = document.getElementById('add-modal-overlay');
      const content = document.getElementById('add-modal-content');
      content.classList.add('hidden-sheet');
      overlay.classList.add('opacity-0');
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 320);
    }

    function setFormCurrency(curr) {
      AudioFX.click();
      document.getElementById('form-currency').value = curr;
      document.querySelectorAll('.form-curr-pill').forEach(btn => {
        btn.className = 'form-curr-pill py-1.5 rounded-lg text-xs font-medium transition text-white/60 hover:text-white';
      });
      const activeBtn = document.getElementById('f-curr-' + curr);
      if (activeBtn) {
        activeBtn.className = 'form-curr-pill py-1.5 rounded-lg text-xs font-bold transition bg-gradient-to-r from-[#00f0ff] to-[#0071e3] text-black shadow-[0_0_10px_rgba(0,240,255,0.4)]';
      }
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function setFormPeriod(days) {
      AudioFX.click();
      document.getElementById('form-period').value = days;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function setOffsetDate(daysOffset) {
      AudioFX.click();
      const d = new Date();
      d.setDate(d.getDate() + daysOffset);
      const iso = d.toISOString().split('T')[0];
      document.getElementById('form-date').value = iso;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function applyPreset(name, price, curr, period, url, event) {
      AudioFX.click();
      document.getElementById('form-name').value = name;
      document.getElementById('form-price').value = price;
      setFormCurrency(curr);
      setFormPeriod(period);
      document.getElementById('form-url').value = url;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      if (particleSystem && event) {
        const x = event.clientX || window.innerWidth / 2;
        const y = event.clientY || window.innerHeight / 2;
        particleSystem.burst(x, y, '#bf5af2', 20);
      }
    }

    async function submitNewSub(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = 'Сохранение...';

      const payload = {
        user_id: state.user_id,
        username: state.first_name || 'User',
        service_name: document.getElementById('form-name').value.trim(),
        price: parseFloat(document.getElementById('form-price').value.replace(',', '.')),
        currency: document.getElementById('form-currency').value,
        period_days: parseInt(document.getElementById('form-period').value),
        next_billing_date: document.getElementById('form-date').value,
        cancel_url: document.getElementById('form-url').value.trim() || null,
      };

      try {
        const res = await fetch('/api/subscriptions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const resData = await res.json();
        if (resData.status === 'ok') {
          AudioFX.chime();
          showToast('Подписка сохранена', '✨');
          
          if (particleSystem) {
            particleSystem.burst(window.innerWidth / 2, window.innerHeight / 2, '#00f0ff', 45);
          }

          closeAddModal();
          document.getElementById('add-sub-form').reset();
          setFormPeriod(30);
          setOffsetDate(30);
          await loadData();
          switchTab('subscriptions');
        } else {
          alert('Ошибка: ' + (resData.message || 'Не удалось сохранить'));
        }
      } catch (err) {
        alert('Ошибка связи с сервером');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Сохранить в StopPay';
      }
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
