<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StopPay  — Подписки</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            apple: {
              black: '#000000',
              card: '#121214',
              surface: '#1c1c1e',
              elevated: '#242426',
              border: 'rgba(255, 255, 255, 0.08)',
              borderHover: 'rgba(255, 255, 255, 0.16)',
              blue: '#2997ff',
              green: '#30d158',
              orange: '#ff9f0a',
              purple: '#bf5af2',
              pink: '#ff375f',
              yellow: '#ffd60a',
              red: '#ff453a',
              gray: '#86868b',
              grayLight: '#aeaeb2',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: #000000;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    input, button, select, textarea {
      font-size: 16px; /* Prevents mobile browser zoom */
    }
    .glass-header {
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-tab {
      background: rgba(28, 28, 30, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .apple-card {
      background-color: #121214;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .apple-card:active {
      transform: scale(0.99);
    }
    .sheet-modal {
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease;
    }
    .sheet-modal.hidden-sheet {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }
    .donut-slice {
      transition: stroke-dasharray 0.6s cubic-bezier(0.16, 1, 0.3, 1), stroke-dashoffset 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #dynamic-toast {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }
    #dynamic-toast.toast-hidden {
      transform: translate(-50%, -120%);
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen bg-black text-[#f5f5f7] flex flex-col pb-28 overflow-x-hidden selection:bg-[#2997ff] selection:text-white">

  <!-- Dynamic Island Toast -->
  <div id="dynamic-toast" class="toast-hidden fixed top-3 left-1/2 -translate-x-1/2 z-50 flex items-center space-x-2 px-4 py-2 rounded-full bg-[#1c1c1e] text-white border border-white/10 shadow-2xl text-xs font-medium">
    <span id="toast-icon">✓</span>
    <span id="toast-message">Успешно</span>
  </div>

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-40 glass-header px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <span class="text-xl leading-none text-white font-semibold"></span>
      <div>
        <div class="text-sm font-bold tracking-tight text-white flex items-center space-x-1.5">
          <span>StopPay</span>
          <span id="user-badge" class="text-[11px] font-normal px-2.5 py-0.5 rounded-full bg-white/10 text-white/90">Загрузка...</span>
        </div>
      </div>
    </div>

    <!-- Currency Selector Segmented Bar -->
    <div class="flex items-center bg-[#1c1c1e] p-0.5 rounded-xl border border-white/10 text-[11px] font-medium">
      <button onclick="changeCurrency('RUB')" id="curr-btn-RUB" class="curr-pill px-2.5 py-1 rounded-lg transition bg-white/15 text-white font-semibold">₽</button>
      <button onclick="changeCurrency('BYN')" id="curr-btn-BYN" class="curr-pill px-2.5 py-1 rounded-lg transition text-white/50 hover:text-white">Br</button>
      <button onclick="changeCurrency('USD')" id="curr-btn-USD" class="curr-pill px-2.5 py-1 rounded-lg transition text-white/50 hover:text-white">$</button>
      <button onclick="changeCurrency('PLN')" id="curr-btn-PLN" class="curr-pill px-2.5 py-1 rounded-lg transition text-white/50 hover:text-white">zł</button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-lg mx-auto w-full px-4 pt-4 space-y-4">

    <!-- TAB 1: ANALYTICS / OVERVIEW -->
    <section id="view-analytics" class="space-y-4">

      <!-- Apple Card Donut Widget -->
      <div class="apple-card rounded-3xl p-5 text-center relative overflow-hidden">
        <div class="absolute -top-16 left-1/2 -translate-x-1/2 w-48 h-48 bg-[#2997ff]/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="relative z-10">
          <div class="text-[10px] font-bold text-[#86868b] tracking-[0.2em] uppercase mb-3">
            В С Е Г О   В   Г О Д
          </div>

          <!-- SVG Donut Chart with Center Display -->
          <div class="relative w-48 h-48 mx-auto my-2">
            <svg viewBox="0 0 160 160" class="w-full h-full -rotate-90">
              <circle cx="80" cy="80" r="62" stroke="#1c1c1e" stroke-width="14" fill="none" />
              <g id="donut-segments"></g>
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none px-2">
              <span id="chart-total-amount" class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">0 ₽</span>
              <span id="chart-monthly-avg" class="text-[11px] text-[#86868b] mt-0.5 font-medium">~0 ₽ / мес</span>
              <div id="chart-services-badge" class="mt-1 text-[9px] font-semibold px-2 py-0.5 rounded-full bg-white/10 text-white/80">
                0 активных
              </div>
            </div>
          </div>

          <!-- Distribution breakdown pills -->
          <div id="services-breakdown" class="mt-4 pt-3 border-t border-white/[0.08] grid grid-cols-2 gap-2 text-left text-xs">
          </div>
        </div>
      </div>

      <!-- Monthly Health/Activity Spend Bar Chart -->
      <div class="apple-card rounded-3xl p-5">
        <div class="flex items-center justify-between mb-4">
          <div>
            <div class="text-[10px] font-bold text-[#86868b] tracking-wider uppercase">Календарь трат</div>
            <div class="text-sm font-bold text-white">Прогноз по месяцам</div>
          </div>
          <span class="text-xs font-semibold text-[#30d158] bg-[#30d158]/10 px-2.5 py-0.5 rounded-full">
            Стабильно
          </span>
        </div>

        <div id="monthly-bars" class="h-28 flex items-end justify-between gap-1 pt-4 pb-2 px-1">
        </div>
        <div class="flex justify-between text-[10px] text-[#86868b] font-medium px-1">
          <span>Янв</span><span>Фев</span><span>Мар</span><span>Апр</span><span>Май</span><span>Июн</span><span>Июл</span><span>Авг</span><span>Сен</span><span>Окт</span><span>Ноя</span><span>Дек</span>
        </div>
      </div>

    </section>

    <!-- TAB 2: SUBSCRIPTIONS LIST -->
    <section id="view-subscriptions" class="hidden space-y-3">
      <div class="flex items-center justify-between px-1">
        <div>
          <div class="text-[10px] font-bold text-[#86868b] tracking-wider uppercase">Управление</div>
          <h2 class="text-base font-bold text-white">Ваши подписки</h2>
        </div>
        <button onclick="openAddModal()" class="flex items-center space-x-1 text-xs font-semibold text-[#2997ff] bg-[#2997ff]/10 hover:bg-[#2997ff]/20 px-3 py-1.5 rounded-full transition">
          <span class="text-base leading-none">＋</span>
          <span>Добавить</span>
        </button>
      </div>

      <!-- Dynamic Subscriptions Container -->
      <div id="subs-list-container" class="space-y-2.5">
      </div>
    </section>

  </main>

  <!-- Bottom Floating Tab Bar (Apple iOS Style) -->
  <nav class="fixed bottom-4 inset-x-4 max-w-sm mx-auto z-40">
    <div class="glass-tab rounded-full p-1.5 shadow-2xl flex items-center justify-around">
      <button onclick="switchTab('analytics')" id="nav-analytics" class="flex-1 flex flex-col items-center py-1.5 rounded-full transition text-white bg-white/10 font-medium">
        <span class="text-base">📊</span>
        <span class="text-[10px] mt-0.5">Обзор</span>
      </button>

      <button onclick="switchTab('subscriptions')" id="nav-subscriptions" class="flex-1 flex flex-col items-center py-1.5 rounded-full transition text-white/50 hover:text-white font-medium">
        <span class="text-base">📋</span>
        <span class="text-[10px] mt-0.5">Подписки</span>
      </button>

      <button onclick="openAddModal()" class="flex-1 flex flex-col items-center py-1.5 rounded-full transition text-[#2997ff] font-medium active:scale-95">
        <span class="text-base font-bold">＋</span>
        <span class="text-[10px] mt-0.5">Создать</span>
      </button>
    </div>
  </nav>

  <!-- Add Subscription Bottom Sheet Modal -->
  <div id="add-modal-overlay" onclick="closeAddModal(event)" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden opacity-0 transition-opacity duration-300">
    <div onclick="event.stopPropagation()" id="add-modal-content" class="sheet-modal hidden-sheet w-full max-w-md bg-[#18181b] border-t sm:border border-white/10 rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto pb-12">
      
      <!-- Sheet Handle -->
      <div class="w-10 h-1 bg-white/20 rounded-full mx-auto sm:hidden mb-1"></div>

      <div class="flex items-center justify-between">
        <h3 class="text-base font-bold text-white">Новая подписка</h3>
        <button type="button" onclick="closeAddModal()" class="w-8 h-8 rounded-full bg-white/10 text-white/60 hover:text-white flex items-center justify-center text-sm">✕</button>
      </div>

      <!-- Quick Preset Chips -->
      <div>
        <div class="text-[10px] text-[#86868b] uppercase font-bold tracking-wider mb-2">Быстрый выбор</div>
        <div class="flex flex-wrap gap-1.5">
          <button type="button" onclick="applyPreset('Яндекс Плюс', 299, 'RUB', 30, 'https://plus.yandex.ru')" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition">Яндекс Плюс</button>
          <button type="button" onclick="applyPreset('Telegram Premium', 399, 'RUB', 30, 'https://telegram.org')" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition">TG Premium</button>
          <button type="button" onclick="applyPreset('Spotify', 19.99, 'PLN', 30, 'https://spotify.com/account')" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition">Spotify</button>
          <button type="button" onclick="applyPreset('Netflix', 14.99, 'USD', 30, 'https://netflix.com/cancel')" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition">Netflix</button>
          <button type="button" onclick="applyPreset('YouTube Premium', 13.99, 'USD', 30, 'https://youtube.com/paid_memberships')" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition">YouTube</button>
          <button type="button" onclick="applyPreset('iCloud+', 149, 'RUB', 30, 'https://appleid.apple.com')" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition">iCloud+</button>
        </div>
      </div>

      <!-- Form with Smooth Keyboard Support -->
      <form id="add-sub-form" onsubmit="submitNewSub(event)" class="space-y-4">
        
        <!-- Service Name -->
        <div>
          <label class="block text-[11px] text-[#86868b] uppercase font-bold tracking-wider mb-1.5">Название сервиса</label>
          <input type="text" id="form-name" required placeholder="Например: Netflix, Кинопоиск..." class="w-full bg-[#121214] border border-white/15 rounded-xl px-3.5 py-2.5 text-base text-white placeholder-white/25 focus:outline-none focus:border-[#2997ff] transition">
        </div>

        <!-- Price and Currency Row -->
        <div class="grid grid-cols-2 gap-3 items-end">
          <div>
            <label class="block text-[11px] text-[#86868b] uppercase font-bold tracking-wider mb-1.5">Стоимость</label>
            <input type="text" inputmode="decimal" id="form-price" required placeholder="299" class="w-full bg-[#121214] border border-white/15 rounded-xl px-3.5 py-2.5 text-base text-white placeholder-white/25 focus:outline-none focus:border-[#2997ff] transition">
          </div>

          <div>
            <label class="block text-[11px] text-[#86868b] uppercase font-bold tracking-wider mb-1.5">Валюта</label>
            <div class="grid grid-cols-4 gap-1 bg-[#121214] border border-white/15 p-1 rounded-xl">
              <button type="button" onclick="setFormCurrency('RUB')" id="f-curr-RUB" class="form-curr-pill py-1.5 rounded-lg text-xs font-bold transition bg-[#0071e3] text-white">₽</button>
              <button type="button" onclick="setFormCurrency('BYN')" id="f-curr-BYN" class="form-curr-pill py-1.5 rounded-lg text-xs font-medium transition text-white/60 hover:text-white">Br</button>
              <button type="button" onclick="setFormCurrency('USD')" id="f-curr-USD" class="form-curr-pill py-1.5 rounded-lg text-xs font-medium transition text-white/60 hover:text-white">$</button>
              <button type="button" onclick="setFormCurrency('PLN')" id="f-curr-PLN" class="form-curr-pill py-1.5 rounded-lg text-xs font-medium transition text-white/60 hover:text-white">zł</button>
            </div>
            <input type="hidden" id="form-currency" value="RUB">
          </div>
        </div>

        <!-- Period Row with Direct Keyboard Input and Quick Buttons -->
        <div>
          <label class="block text-[11px] text-[#86868b] uppercase font-bold tracking-wider mb-1.5">Период списания (дней)</label>
          <div class="flex items-center space-x-2">
            <input type="number" id="form-period" value="30" min="1" max="3650" required class="w-28 bg-[#121214] border border-white/15 rounded-xl px-3 py-2 text-center text-base text-white focus:outline-none focus:border-[#2997ff] transition">
            <div class="flex-1 flex gap-1.5">
              <button type="button" onclick="setFormPeriod(30)" class="flex-1 py-2 text-xs rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 text-white font-medium transition">30 дн.</button>
              <button type="button" onclick="setFormPeriod(365)" class="flex-1 py-2 text-xs rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 text-white font-medium transition">1 год</button>
              <button type="button" onclick="setFormPeriod(7)" class="flex-1 py-2 text-xs rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 text-white font-medium transition">7 дн.</button>
            </div>
          </div>
        </div>

        <!-- Next Billing Date with Quick Buttons and Reliable Input -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-[11px] text-[#86868b] uppercase font-bold tracking-wider">Дата списания</label>
            <div class="flex space-x-2">
              <button type="button" onclick="setOffsetDate(0)" class="text-[11px] text-[#2997ff] hover:underline">Сегодня</button>
              <button type="button" onclick="setOffsetDate(30)" class="text-[11px] text-[#2997ff] hover:underline">+30 дн.</button>
              <button type="button" onclick="setOffsetDate(365)" class="text-[11px] text-[#2997ff] hover:underline">+1 год</button>
            </div>
          </div>
          <input type="date" id="form-date" required class="w-full bg-[#121214] border border-white/15 rounded-xl px-3.5 py-2.5 text-base text-white focus:outline-none focus:border-[#2997ff] transition cursor-pointer">
        </div>

        <!-- Cancellation URL -->
        <div>
          <label class="block text-[11px] text-[#86868b] uppercase font-bold tracking-wider mb-1.5">Ссылка на отмену (опционально)</label>
          <input type="url" id="form-url" placeholder="https://service.com/cancel" class="w-full bg-[#121214] border border-white/15 rounded-xl px-3.5 py-2.5 text-base text-white placeholder-white/25 focus:outline-none focus:border-[#2997ff] transition">
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-[#0071e3] hover:bg-[#0077ed] text-white font-bold py-3.5 rounded-xl transition text-base flex items-center justify-center space-x-2 mt-2 shadow-lg shadow-[#0071e3]/20 active:scale-[0.99]">
          <span>Сохранить подписку</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    // State
    const state = {
      user_id: null,
      first_name: '',
      currency: 'RUB',
      activeTab: 'analytics',
      subscriptions: [],
      metrics: null
    };

    const APPLE_COLORS = ['#2997ff', '#30d158', '#ff9f0a', '#bf5af2', '#ff375f', '#ffd60a', '#64d2ff'];
    const CURRENCY_SYMBOLS = { RUB: '₽', BYN: 'Br', USD: '$', PLN: 'zł' };

    const tg = window.Telegram?.WebApp;

    function resolveUser() {
      // 1. Telegram WebApp SDK initDataUnsafe
      if (tg?.initDataUnsafe?.user?.id) {
        state.user_id = tg.initDataUnsafe.user.id;
        state.first_name = tg.initDataUnsafe.user.first_name || '';
        return;
      }

      // 2. Raw initData query string
      if (tg?.initData) {
        try {
          const p = new URLSearchParams(tg.initData);
          const uStr = p.get('user');
          if (uStr) {
            const u = JSON.parse(uStr);
            if (u.id) {
              state.user_id = u.id;
              state.first_name = u.first_name || '';
              return;
            }
          }
        } catch(e) {}
      }

      // 3. Telegram WebApp hash (#tgWebAppData=...)
      if (window.location.hash) {
        try {
          const hashParams = new URLSearchParams(window.location.hash.substring(1));
          const tgData = hashParams.get('tgWebAppData');
          if (tgData) {
            const inner = new URLSearchParams(tgData);
            const uStr = inner.get('user');
            if (uStr) {
              const u = JSON.parse(uStr);
              if (u.id) {
                state.user_id = u.id;
                state.first_name = u.first_name || '';
                return;
              }
            }
          }
        } catch(e) {}
      }

      // 4. URL query parameters ?user_id=...&name=...
      const urlParams = new URLSearchParams(window.location.search);
      const urlId = urlParams.get('user_id');
      if (urlId && !isNaN(parseInt(urlId))) {
        state.user_id = parseInt(urlId);
        const urlName = urlParams.get('name');
        if (urlName) state.first_name = decodeURIComponent(urlName);
        return;
      }

      // 5. Saved in localStorage
      const stored = localStorage.getItem('stoppay_user_id');
      if (stored && !isNaN(parseInt(stored))) {
        state.user_id = parseInt(stored);
        const storedName = localStorage.getItem('stoppay_user_name');
        if (storedName) state.first_name = storedName;
        return;
      }
    }

    function initApp() {
      if (tg) {
        try {
          tg.ready();
          tg.expand();
          tg.setHeaderColor('#000000');
          tg.setBackgroundColor('#000000');
          tg.enableClosingConfirmation();
        } catch(e) {}
      }

      resolveUser();

      if (state.user_id) {
        localStorage.setItem('stoppay_user_id', state.user_id);
        if (state.first_name) localStorage.setItem('stoppay_user_name', state.first_name);
      }

      updateUserBadge();
      setOffsetDate(30);
      loadData();
    }

    function updateUserBadge() {
      const badge = document.getElementById('user-badge');
      if (state.first_name) {
        badge.innerText = state.first_name;
      } else {
        badge.innerText = 'Личный кабинет';
      }
    }

    // Dynamic Island Toast Helper
    function showToast(msg, icon = '✓') {
      const toast = document.getElementById('dynamic-toast');
      document.getElementById('toast-message').innerText = msg;
      document.getElementById('toast-icon').innerText = icon;
      toast.classList.remove('toast-hidden');

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }

      setTimeout(() => {
        toast.classList.add('toast-hidden');
      }, 2400);
    }

    // Tab Switching
    function switchTab(tab) {
      state.activeTab = tab;
      const vAnalytics = document.getElementById('view-analytics');
      const vSubs = document.getElementById('view-subscriptions');
      const nAnalytics = document.getElementById('nav-analytics');
      const nSubs = document.getElementById('nav-subscriptions');

      if (tab === 'analytics') {
        vAnalytics.classList.remove('hidden');
        vSubs.classList.add('hidden');
        nAnalytics.className = 'flex-1 flex flex-col items-center py-1.5 rounded-full transition text-white bg-white/10 font-medium';
        nSubs.className = 'flex-1 flex flex-col items-center py-1.5 rounded-full transition text-white/50 hover:text-white font-medium';
      } else {
        vAnalytics.classList.add('hidden');
        vSubs.classList.remove('hidden');
        nSubs.className = 'flex-1 flex flex-col items-center py-1.5 rounded-full transition text-white bg-white/10 font-medium';
        nAnalytics.className = 'flex-1 flex flex-col items-center py-1.5 rounded-full transition text-white/50 hover:text-white font-medium';
      }

      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    // Currency Switch
    function changeCurrency(curr) {
      state.currency = curr;
      document.querySelectorAll('.curr-pill').forEach(btn => {
        btn.className = 'curr-pill px-2.5 py-1 rounded-lg transition text-white/50 hover:text-white';
      });
      const activeBtn = document.getElementById('curr-btn-' + curr);
      if (activeBtn) {
        activeBtn.className = 'curr-pill px-2.5 py-1 rounded-lg transition bg-white/15 text-white font-semibold';
      }
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      loadData();
    }

    // Fetch data from real backend REST API
    async function loadData() {
      try {
        let url = `/api/subscriptions?currency=${state.currency}`;
        if (state.user_id) {
          url += `&user_id=${state.user_id}`;
        }
        const res = await fetch(url);
        const data = await res.json();

        if (data.status === 'ok') {
          // If backend resolved the real user ID, update it
          if (data.user_id && !state.user_id) {
            state.user_id = data.user_id;
            localStorage.setItem('stoppay_user_id', data.user_id);
          }
          state.subscriptions = data.subscriptions || [];
          state.metrics = data.metrics || null;
          updateUserBadge();
          renderUI();
        }
      } catch (e) {
        console.error('Error fetching subscriptions:', e);
      }
    }

    function renderUI() {
      renderDonutChart();
      renderMonthlyBars();
      renderSubscriptionsList();
    }

    function fmt(num) {
      return Math.round(num).toLocaleString('ru-RU');
    }

    function renderDonutChart() {
      const sym = CURRENCY_SYMBOLS[state.currency] || state.currency;
      const g = document.getElementById('donut-segments');
      const breakdownEl = document.getElementById('services-breakdown');
      g.innerHTML = '';
      breakdownEl.innerHTML = '';

      if (!state.metrics || state.metrics.services_count === 0) {
        document.getElementById('chart-total-amount').innerText = `0 ${sym}`;
        document.getElementById('chart-monthly-avg').innerText = `~0 ${sym} / мес`;
        document.getElementById('chart-services-badge').innerText = '0 активных';
        breakdownEl.innerHTML = '<div class="col-span-2 text-center text-[#86868b] py-2">Нет активных подписок</div>';
        return;
      }

      const total = state.metrics.total_annual;
      const monthly = state.metrics.monthly_avg;
      const count = state.metrics.services_count;
      const services = state.metrics.services;

      document.getElementById('chart-total-amount').innerText = `${fmt(total)} ${sym}`;
      document.getElementById('chart-monthly-avg').innerText = `~${fmt(monthly)} ${sym} / мес`;
      document.getElementById('chart-services-badge').innerText = `${count} ${pluralizeSubs(count)}`;

      const r = 62;
      const circumference = 2 * Math.PI * r;
      let currentOffset = 0;

      services.forEach((s, idx) => {
        const color = APPLE_COLORS[idx % APPLE_COLORS.length];
        const fraction = total > 0 ? (s.annual_cost / total) : 0;
        const dashLength = fraction * circumference;
        const gapLength = circumference - dashLength;
        const pct = Math.round(fraction * 100);

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', '80');
        circle.setAttribute('cy', '80');
        circle.setAttribute('r', r.toString());
        circle.setAttribute('stroke', color);
        circle.setAttribute('stroke-width', '14');
        circle.setAttribute('fill', 'none');
        circle.setAttribute('stroke-dasharray', `${dashLength} ${gapLength}`);
        circle.setAttribute('stroke-dashoffset', (-currentOffset).toString());
        circle.setAttribute('class', 'donut-slice');
        g.appendChild(circle);

        currentOffset += dashLength;

        const pill = document.createElement('div');
        pill.className = 'flex items-center space-x-2 bg-white/[0.03] p-2 rounded-xl border border-white/[0.04]';
        pill.innerHTML = `
          <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color: ${color}"></span>
          <div class="truncate flex-1">
            <div class="text-white font-medium truncate">${s.name}</div>
            <div class="text-[10px] text-[#86868b]">${fmt(s.annual_cost)} ${sym}/год (${pct}%)</div>
          </div>
        `;
        breakdownEl.appendChild(pill);
      });
    }

    function pluralizeSubs(n) {
      if (n % 10 === 1 && n % 100 !== 11) return 'активная';
      return 'активных';
    }

    function renderMonthlyBars() {
      const container = document.getElementById('monthly-bars');
      container.innerHTML = '';
      const sym = CURRENCY_SYMBOLS[state.currency] || state.currency;
      const baseMonthly = state.metrics ? state.metrics.monthly_avg : 0;
      const currentMonth = new Date().getMonth();

      for (let m = 0; m < 12; m++) {
        const isCurrent = m === currentMonth;
        const factor = baseMonthly > 0 ? (0.92 + ((m * 3) % 17) / 100) : 0.05;
        const val = baseMonthly * factor;
        const heightPct = baseMonthly > 0 ? Math.min(100, Math.max(15, (factor / 1.1) * 90)) : 10;

        const col = document.createElement('div');
        col.className = 'flex-1 h-full flex items-end justify-center group relative cursor-pointer';
        
        const barColor = isCurrent ? 'bg-[#2997ff] shadow-[0_0_12px_rgba(41,151,255,0.6)]' : 'bg-[#262629] hover:bg-white/30';

        col.innerHTML = `
          <div class="w-full ${barColor} rounded-full transition-all duration-300" style="height: ${heightPct}%"></div>
          <div class="absolute -top-7 opacity-0 group-hover:opacity-100 transition-opacity bg-[#1c1c1e] text-[10px] px-1.5 py-0.5 rounded border border-white/10 pointer-events-none whitespace-nowrap z-20">
            ${fmt(val)} ${sym}
          </div>
        `;
        container.appendChild(col);
      }
    }

    function renderSubscriptionsList() {
      const container = document.getElementById('subs-list-container');
      container.innerHTML = '';

      if (state.subscriptions.length === 0) {
        container.innerHTML = `
          <div class="apple-card rounded-2xl p-8 text-center space-y-3">
            <span class="text-3xl">💳</span>
            <div class="text-sm font-semibold text-white">Нет активных подписок</div>
            <div class="text-xs text-[#86868b] max-w-xs mx-auto">Добавьте ваши регулярные сервисы, чтобы бот предупреждал о списаниях за 24 часа.</div>
            <button onclick="openAddModal()" class="bg-[#0071e3] text-white text-xs px-4 py-2 rounded-full font-medium transition mt-2">
              ＋ Добавить подписку
            </button>
          </div>
        `;
        return;
      }

      state.subscriptions.forEach(sub => {
        const sym = CURRENCY_SYMBOLS[sub.currency] || sub.currency;
        const isActive = sub.is_active;
        const card = document.createElement('div');
        card.className = `apple-card rounded-2xl p-4 transition ${isActive ? '' : 'opacity-60'}`;

        let daysNotice = '';
        if (sub.next_billing_date) {
          const bDate = new Date(sub.next_billing_date);
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          bDate.setHours(0, 0, 0, 0);
          const diffDays = Math.round((bDate - today) / (1000 * 60 * 60 * 24));

          const dateStr = bDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
          if (diffDays < 0) {
            daysNotice = `<span class="text-[#ff453a] font-medium">${dateStr} (просрочено)</span>`;
          } else if (diffDays === 0) {
            daysNotice = `<span class="text-[#ff9f0a] font-bold animate-pulse">Сегодня!</span>`;
          } else if (diffDays <= 3) {
            daysNotice = `<span class="text-[#ff9f0a] font-medium">${dateStr} (через ${diffDays} дн.)</span>`;
          } else {
            daysNotice = `<span class="text-[#86868b]">${dateStr} (через ${diffDays} дн.)</span>`;
          }
        }

        const cancelBtn = sub.cancel_url
          ? `<a href="${sub.cancel_url}" target="_blank" class="text-[11px] text-[#2997ff] hover:underline flex items-center space-x-0.5"><span>↗ Отменить</span></a>`
          : '';

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3 truncate">
              <div class="w-10 h-10 rounded-xl bg-[#1c1c1e] border border-white/10 flex items-center justify-center text-base font-bold text-white flex-shrink-0">
                ${sub.service_name.charAt(0).toUpperCase()}
              </div>
              <div class="truncate">
                <div class="text-sm font-semibold text-white truncate flex items-center space-x-1.5">
                  <span>${sub.service_name}</span>
                  ${sub.cancel_url ? cancelBtn : ''}
                </div>
                <div class="text-[11px] mt-0.5">
                  ${daysNotice}
                </div>
              </div>
            </div>

            <div class="flex items-center space-x-3 flex-shrink-0">
              <div class="text-right">
                <div class="text-sm font-bold text-white">${sub.price} ${sym}</div>
                <div class="text-[10px] text-[#86868b]">${sub.period_days} дн.</div>
              </div>

              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" ${isActive ? 'checked' : ''} onchange="toggleSub(${sub.id}, this)" class="sr-only peer">
                <div class="w-11 h-6 bg-[#262629] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#30d158]"></div>
              </label>

              <button onclick="deleteSub(${sub.id})" class="w-7 h-7 rounded-full bg-white/5 hover:bg-[#ff453a]/20 text-[#86868b] hover:text-[#ff453a] flex items-center justify-center transition text-xs">
                ✕
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function toggleSub(subId, checkbox) {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      const sub = state.subscriptions.find(s => s.id === subId);
      if (sub) {
        sub.is_active = checkbox.checked;
        showToast(checkbox.checked ? 'Подписка активирована' : 'Подписка на паузе');
      }

      try {
        const res = await fetch(`/api/subscriptions/${subId}/toggle`, { method: 'POST' });
        const resData = await res.json();
        if (resData.status === 'ok') {
          loadData();
        }
      } catch (e) {
        console.error('Failed to toggle:', e);
      }
    }

    async function deleteSub(subId) {
      if (!confirm('Удалить эту подписку?')) return;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');

      try {
        await fetch(`/api/subscriptions/${subId}`, { method: 'DELETE' });
        showToast('Подписка удалена');
        loadData();
      } catch (e) {
        console.error('Failed to delete:', e);
      }
    }

    // Modal Sheet Handlers
    function openAddModal() {
      const overlay = document.getElementById('add-modal-overlay');
      const content = document.getElementById('add-modal-content');
      overlay.classList.remove('hidden');
      setTimeout(() => {
        overlay.classList.remove('opacity-0');
        content.classList.remove('hidden-sheet');
        document.getElementById('form-name').focus();
      }, 10);
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function closeAddModal(e) {
      if (e && e.target !== e.currentTarget && e.target.tagName !== 'BUTTON') return;
      const overlay = document.getElementById('add-modal-overlay');
      const content = document.getElementById('add-modal-content');
      content.classList.add('hidden-sheet');
      overlay.classList.add('opacity-0');
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 300);
    }

    function setFormCurrency(curr) {
      document.getElementById('form-currency').value = curr;
      document.querySelectorAll('.form-curr-pill').forEach(btn => {
        btn.className = 'form-curr-pill py-1.5 rounded-lg text-xs font-medium transition text-white/60 hover:text-white';
      });
      const activeBtn = document.getElementById('f-curr-' + curr);
      if (activeBtn) {
        activeBtn.className = 'form-curr-pill py-1.5 rounded-lg text-xs font-bold transition bg-[#0071e3] text-white';
      }
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function setFormPeriod(days) {
      document.getElementById('form-period').value = days;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function setOffsetDate(daysOffset) {
      const d = new Date();
      d.setDate(d.getDate() + daysOffset);
      const iso = d.toISOString().split('T')[0];
      document.getElementById('form-date').value = iso;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function applyPreset(name, price, curr, period, url) {
      document.getElementById('form-name').value = name;
      document.getElementById('form-price').value = price;
      setFormCurrency(curr);
      setFormPeriod(period);
      document.getElementById('form-url').value = url;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    async function submitNewSub(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = 'Сохранение...';

      const payload = {
        user_id: state.user_id,
        username: state.first_name || 'User',
        service_name: document.getElementById('form-name').value.trim(),
        price: parseFloat(document.getElementById('form-price').value.replace(',', '.')),
        currency: document.getElementById('form-currency').value,
        period_days: parseInt(document.getElementById('form-period').value),
        next_billing_date: document.getElementById('form-date').value,
        cancel_url: document.getElementById('form-url').value.trim() || null,
      };

      try {
        const res = await fetch('/api/subscriptions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const resData = await res.json();
        if (resData.status === 'ok') {
          showToast('Подписка сохранена');
          closeAddModal();
          document.getElementById('add-sub-form').reset();
          setFormPeriod(30);
          setOffsetDate(30);
          await loadData();
          switchTab('subscriptions');
        } else {
          alert('Ошибка: ' + (resData.message || 'Не удалось сохранить'));
        }
      } catch (err) {
        alert('Ошибка связи с сервером');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Сохранить подписку';
      }
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
