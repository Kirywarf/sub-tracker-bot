<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StopPay  — Подписки</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          screens: {
            'xs': '380px',
          },
          colors: {
            apple: {
              black: '#000000',
              card: '#121215',
              surface: '#1c1c1e',
              elevated: '#242428',
              blue: '#0071e3',
              blueLight: '#2997ff',
              green: '#30d158',
              orange: '#ff9f0a',
              purple: '#af52de',
              pink: '#ff375f',
              yellow: '#ffd60a',
              red: '#ff453a',
              gray: '#86868b',
              grayLight: '#d2d2d7',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    
    html, body {
      background-color: #000000;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh;
    }

    input, button, select, textarea {
      font-size: 16px; /* Prevents mobile browser auto-zoom */
    }

    /* Hide scrollbars for clean mobile appearance */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Apple.com Cinematic Ambient Lighting */
    .ambient-aurora {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .aurora-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.28;
      will-change: transform;
    }
    .orb-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #0071e3 0%, rgba(41, 151, 255, 0.4) 60%, transparent 85%);
      top: -100px;
      left: 15%;
      animation: appleFloat1 18s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, #af52de 0%, rgba(94, 92, 230, 0.3) 65%, transparent 85%);
      top: 35%;
      right: -100px;
      animation: appleFloat2 22s ease-in-out infinite alternate;
    }
    .orb-3 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #30d158 0%, rgba(0, 113, 227, 0.3) 70%, transparent 85%);
      bottom: 0%;
      left: -80px;
      animation: appleFloat3 20s ease-in-out infinite alternate;
    }

    @keyframes appleFloat1 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 60px) scale(1.12); }
      100% { transform: translate(-30px, 90px) scale(0.96); }
    }
    @keyframes appleFloat2 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-50px, -40px) scale(1.15); }
      100% { transform: translate(30px, 45px) scale(1); }
    }
    @keyframes appleFloat3 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, -50px) scale(1.1); }
      100% { transform: translate(-30px, 30px) scale(0.95); }
    }

    /* Particle Canvas */
    #particle-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 60;
    }

    /* Apple.com Liquid Glass Card */
    .glass-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.06) 0%, rgba(18, 18, 22, 0.8) 45%, rgba(10, 10, 12, 0.95) 100%);
      backdrop-filter: blur(35px) saturate(190%);
      -webkit-backdrop-filter: blur(35px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.65), inset 0 1px 1px 0 rgba(255, 255, 255, 0.22), inset 0 -1px 1px 0 rgba(0, 0, 0, 0.5);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease;
      will-change: transform;
    }
    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 0 25px 55px -10px rgba(0, 0, 0, 0.75), 0 0 25px -5px rgba(41, 151, 255, 0.2), inset 0 1px 1px 0 rgba(255, 255, 255, 0.35);
    }

    /* Apple Specular Reflection Glare */
    .card-glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.35s ease;
      z-index: 10;
      mix-blend-mode: overlay;
    }

    /* Apple Header Bar */
    .glass-header {
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    /* Apple Floating Dock */
    .glass-dock {
      background: rgba(24, 24, 28, 0.86);
      backdrop-filter: blur(36px) saturate(200%);
      -webkit-backdrop-filter: blur(36px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), inset 0 1px 1px rgba(255, 255, 255, 0.25);
    }
    .dock-container {
      bottom: calc(0.9rem + var(--sab));
    }

    .donut-slice {
      transition: stroke-dasharray 0.85s cubic-bezier(0.16, 1, 0.3, 1), stroke-dashoffset 0.85s cubic-bezier(0.16, 1, 0.3, 1);
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
    }

    /* Dynamic Island Pill */
    #dynamic-toast {
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
    }
    #dynamic-toast.toast-hidden {
      transform: translate(-50%, -140%) scale(0.88);
      opacity: 0;
      pointer-events: none;
    }

    /* Sheet Modal */
    .sheet-modal {
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }
    .sheet-modal.hidden-sheet {
      transform: translateY(105%);
      opacity: 0;
      pointer-events: none;
    }

    /* Radar Ping Indicator */
    .radar-pulse {
      position: relative;
    }
    .radar-pulse::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: inherit;
      opacity: 0.7;
      animation: radarPing 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes radarPing {
      75%, 100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    /* Apple-Style iOS Toggle Switch */
    .cyber-toggle:checked + .cyber-toggle-track {
      background-color: #30d158;
      box-shadow: 0 0 10px rgba(48, 209, 88, 0.45);
    }
    .cyber-toggle:checked + .cyber-toggle-track .cyber-toggle-thumb {
      transform: translateX(18px);
      background-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    /* Apple Dock Active Tab Pill */
    .dock-pill {
      transition: all 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Monthly Calendar Tooltip (Edge-clamped for mobile) */
    .bar-col {
      position: relative;
    }
    .bar-col .bar-tooltip {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      opacity: 0;
      pointer-events: none;
      background-color: #1c1c1e;
      color: #ffffff;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
      z-index: 30;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .bar-col:hover .bar-tooltip,
    .bar-col.active-bar .bar-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Clamping for first and last month tooltips so they don't clip off-screen */
    .bar-col:first-child .bar-tooltip {
      left: 0;
      transform: translateX(0) translateY(4px);
    }
    .bar-col:first-child:hover .bar-tooltip,
    .bar-col:first-child.active-bar .bar-tooltip {
      transform: translateX(0) translateY(0);
    }

    .bar-col:last-child .bar-tooltip {
      left: auto;
      right: 0;
      transform: translateX(0) translateY(4px);
    }
    .bar-col:last-child:hover .bar-tooltip,
    .bar-col:last-child.active-bar .bar-tooltip {
      transform: translateX(0) translateY(0);
    }
  </style>
</head>

<body class="min-h-screen bg-black text-[#f5f5f7] flex flex-col pb-36 overflow-x-hidden selection:bg-[#0071e3] selection:text-white">

  <!-- Apple Cinematic Ambient Lighting -->
  <div class="ambient-aurora">
    <div class="aurora-orb orb-1"></div>
    <div class="aurora-orb orb-2"></div>
    <div class="aurora-orb orb-3"></div>
  </div>

  <!-- Interactive Particles Canvas -->
  <canvas id="particle-canvas"></canvas>

  <!-- Apple Dynamic Island Toast -->
  <div id="dynamic-toast" class="toast-hidden fixed top-3 left-1/2 -translate-x-1/2 z-50 flex items-center space-x-2 px-4 py-2 rounded-full bg-[#1c1c1e]/90 text-white border border-white/15 shadow-[0_8px_30px_rgba(0,0,0,0.6)] text-xs font-semibold">
    <span id="toast-icon" class="w-4 h-4 rounded-full bg-[#30d158]/20 text-[#30d158] flex items-center justify-center text-xs font-bold">✓</span>
    <span id="toast-message" class="tracking-tight text-white/90">Успешно</span>
  </div>

  <!-- Apple Top Navigation Bar (Mobile Two-Tier Architecture) -->
  <header class="sticky top-0 z-40 glass-header px-4 py-2.5 space-y-2.5">
    <!-- Row 1: Brand Info & Sound FX -->
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-xl bg-white/10 border border-white/15 flex items-center justify-center shadow-sm flex-shrink-0">
          <span class="text-base text-white leading-none font-semibold"></span>
        </div>
        <div>
          <div class="text-sm font-bold tracking-tight text-white flex items-center space-x-1.5">
            <span>StopPay</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-white/10 text-white/60 font-medium">Mini App</span>
          </div>
          <div id="user-badge" class="text-[11px] font-normal text-[#86868b] truncate max-w-[150px]">Личный кабинет</div>
        </div>
      </div>

      <!-- Right: Sound FX Button -->
      <div class="flex items-center space-x-2">
        <button onclick="toggleSound()" id="sound-toggle-btn" title="Sound" class="h-8 px-2.5 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-center space-x-1.5 text-xs text-white/80 transition active:scale-95">
          <span id="sound-icon">🔊</span>
          <span class="text-[10px] font-medium text-white/50 hidden xs:inline">FX</span>
        </button>
      </div>
    </div>

    <!-- Row 2: Symmetrical Dual Mobile Segmented Controls (Currency & Language) -->
    <div class="grid grid-cols-2 gap-2 pt-0.5">
      <!-- Currency Switcher Segmented Glass Bar -->
      <div class="flex items-center bg-[#1c1c1e]/90 p-0.5 rounded-xl border border-white/10 shadow-inner">
        <button onclick="changeCurrency('RUB')" id="curr-btn-RUB" class="curr-pill flex-1 py-1.5 text-center rounded-lg transition bg-white/20 text-white font-semibold text-xs shadow-sm active:scale-95">₽</button>
        <button onclick="changeCurrency('BYN')" id="curr-btn-BYN" class="curr-pill flex-1 py-1.5 text-center rounded-lg transition text-white/50 hover:text-white font-medium text-xs active:scale-95">Br</button>
        <button onclick="changeCurrency('USD')" id="curr-btn-USD" class="curr-pill flex-1 py-1.5 text-center rounded-lg transition text-white/50 hover:text-white font-medium text-xs active:scale-95">$</button>
        <button onclick="changeCurrency('PLN')" id="curr-btn-PLN" class="curr-pill flex-1 py-1.5 text-center rounded-lg transition text-white/50 hover:text-white font-medium text-xs active:scale-95">zł</button>
      </div>

      <!-- Language Selector Glass Bar -->
      <div class="flex items-center bg-[#1c1c1e]/90 p-0.5 rounded-xl border border-white/10 shadow-inner">
        <button onclick="changeLanguage('ru')" id="lang-btn-ru" class="lang-pill flex-1 py-1.5 text-center rounded-lg transition bg-white/20 text-white font-semibold text-[11px] shadow-sm active:scale-95">RU</button>
        <button onclick="changeLanguage('be')" id="lang-btn-be" class="lang-pill flex-1 py-1.5 text-center rounded-lg transition text-white/50 hover:text-white font-medium text-[11px] active:scale-95">BE</button>
        <button onclick="changeLanguage('en')" id="lang-btn-en" class="lang-pill flex-1 py-1.5 text-center rounded-lg transition text-white/50 hover:text-white font-medium text-[11px] active:scale-95">EN</button>
        <button onclick="changeLanguage('pl')" id="lang-btn-pl" class="lang-pill flex-1 py-1.5 text-center rounded-lg transition text-white/50 hover:text-white font-medium text-[11px] active:scale-95">PL</button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="relative z-10 flex-1 max-w-lg mx-auto w-full px-4 pt-4 space-y-4">

    <!-- TAB 1: ANALYTICS / OVERVIEW -->
    <section id="view-analytics" class="space-y-4">

      <!-- Apple Card Donut Overview Widget -->
      <div class="glass-card p-5 sm:p-6 text-center relative">
        <div class="card-glare"></div>

        <div class="relative z-10">
          <div class="flex items-center justify-between mb-2 px-1">
            <div id="i18n-annual-spend-title" class="text-[10px] font-bold text-[#86868b] tracking-[0.2em] uppercase">
              В С Е Г О   В   Г О Д
            </div>
            <div class="flex items-center space-x-1.5 text-[10px] font-medium text-[#30d158] bg-[#30d158]/10 px-2 py-0.5 rounded-full border border-[#30d158]/25">
              <span class="w-1.5 h-1.5 rounded-full bg-[#30d158] radar-pulse"></span>
              <span id="i18n-active-badge">Активно</span>
            </div>
          </div>

          <!-- SVG Donut Chart with Center Display -->
          <div class="relative w-48 h-48 sm:w-52 sm:h-52 mx-auto my-3 flex items-center justify-center">
            
            <svg viewBox="0 0 160 160" class="w-full h-full -rotate-90">
              <circle cx="80" cy="80" r="62" stroke="rgba(255, 255, 255, 0.06)" stroke-width="14" fill="none" />
              <g id="donut-segments"></g>
            </svg>

            <!-- Holographic Center Hub -->
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none px-2 text-center">
              <span id="chart-total-amount" class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
                0 ₽
              </span>
              <span id="chart-monthly-avg" class="text-xs text-[#86868b] mt-0.5 font-medium tracking-normal">
                0 ₽ / мес
              </span>
              <div id="chart-services-badge" class="mt-2 text-[10px] font-semibold px-2.5 py-0.5 rounded-full bg-white/10 text-white/90 border border-white/10">
                0 активных
              </div>
            </div>
          </div>

          <!-- Distribution breakdown list -->
          <div id="services-breakdown" class="mt-5 pt-4 border-t border-white/[0.08] grid grid-cols-1 sm:grid-cols-2 gap-2 text-left text-xs">
          </div>
        </div>
      </div>

      <!-- Monthly Spend Bar Chart -->
      <div class="glass-card p-5 relative">
        <div class="card-glare"></div>
        <div class="relative z-10">
          <div class="flex items-center justify-between mb-3">
            <div>
              <div id="i18n-calendar-title" class="text-[10px] font-bold text-[#86868b] tracking-wider uppercase">Календарь списаний</div>
              <div id="monthly-forecast-title" class="text-sm font-bold text-white">В этом месяце: 0 ₽</div>
            </div>
            <span id="monthly-forecast-badge" class="text-xs font-semibold text-[#30d158] bg-[#30d158]/10 border border-[#30d158]/20 px-2.5 py-0.5 rounded-full flex items-center space-x-1">
              <span id="i18n-normal-badge">В норме</span>
            </span>
          </div>

          <div id="monthly-bars" class="h-28 flex items-end justify-between gap-1.5 pt-4 pb-2 px-1">
          </div>
          <div class="flex justify-between text-[10px] text-[#86868b] font-medium px-1 mt-1">
            <span id="m-lbl-0">Янв</span><span id="m-lbl-1">Фев</span><span id="m-lbl-2">Мар</span><span id="m-lbl-3">Апр</span><span id="m-lbl-4">Май</span><span id="m-lbl-5">Июн</span><span id="m-lbl-6">Июл</span><span id="m-lbl-7">Авг</span><span id="m-lbl-8">Сен</span><span id="m-lbl-9">Окт</span><span id="m-lbl-10">Ноя</span><span id="m-lbl-11">Дек</span>
          </div>
        </div>
      </div>

    </section>

    <!-- TAB 2: SUBSCRIPTIONS LIST -->
    <section id="view-subscriptions" class="hidden space-y-3">
      <div class="flex items-center justify-between px-1">
        <div>
          <div id="i18n-manage-title" class="text-[10px] font-bold text-[#86868b] tracking-wider uppercase">Управление</div>
          <h2 id="i18n-your-subs-title" class="text-base font-bold text-white">Ваши подписки</h2>
        </div>
        <button onclick="openAddModal(event)" class="flex items-center space-x-1.5 text-xs font-semibold text-white bg-[#0071e3] hover:bg-[#0077ed] px-4 py-2 rounded-full transition shadow-md active:scale-95">
          <span class="text-base leading-none">＋</span>
          <span id="i18n-add-sub-btn-text">Добавить</span>
        </button>
      </div>

      <!-- Dynamic Subscriptions Container -->
      <div id="subs-list-container" class="space-y-3">
      </div>
    </section>

  </main>

  <!-- Bottom Floating Capsule Dock (Apple Style) -->
  <nav class="fixed dock-container inset-x-4 max-w-sm mx-auto z-40">
    <div class="glass-dock rounded-full p-1.5 shadow-2xl flex items-center justify-around relative">
      <button onclick="switchTab('analytics')" id="nav-analytics" class="dock-pill flex-1 flex flex-col items-center py-2.5 rounded-full transition text-white bg-white/15 font-semibold active:scale-95">
        <span class="text-base leading-none">📊</span>
        <span id="i18n-dock-overview" class="text-[11px] mt-1 font-medium">Обзор</span>
      </button>

      <button onclick="switchTab('subscriptions')" id="nav-subscriptions" class="dock-pill flex-1 flex flex-col items-center py-2.5 rounded-full transition text-white/50 hover:text-white font-medium active:scale-95">
        <span class="text-base leading-none">📋</span>
        <span id="i18n-dock-subs" class="text-[11px] mt-1 font-medium">Подписки</span>
      </button>

      <button onclick="openAddModal(event)" class="dock-pill flex-1 flex flex-col items-center py-2.5 rounded-full transition text-[#2997ff] hover:text-white font-semibold active:scale-95">
        <span class="text-base leading-none font-bold">＋</span>
        <span id="i18n-dock-create" class="text-[11px] mt-1 font-medium">Создать</span>
      </button>
    </div>
  </nav>

  <!-- Add Subscription Bottom Sheet Modal -->
  <div id="add-modal-overlay" onclick="closeAddModal(event)" class="fixed inset-0 bg-black/75 backdrop-blur-md z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden opacity-0 transition-opacity duration-300">
    <div onclick="event.stopPropagation()" id="add-modal-content" class="sheet-modal hidden-sheet w-full max-w-md bg-[#141418] border-t sm:border border-white/15 rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto pb-12">
      
      <!-- Sheet Handle -->
      <div class="w-10 h-1 bg-white/20 rounded-full mx-auto sm:hidden mb-2"></div>

      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <h3 id="i18n-modal-title" class="text-base font-bold text-white">Новая подписка</h3>
        </div>
        <button type="button" onclick="closeAddModal()" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-white/80 hover:text-white flex items-center justify-center text-sm transition active:scale-90">✕</button>
      </div>

      <!-- Quick Preset Chips (Smooth horizontal scrollable pill row) -->
      <div>
        <div id="i18n-preset-title" class="text-[10px] text-[#86868b] uppercase font-bold tracking-wider mb-2">Быстрый выбор</div>
        <div class="flex overflow-x-auto no-scrollbar gap-2 pb-1 -mx-1 px-1">
          <button type="button" onclick="applyPreset('Яндекс Плюс', 299, 'RUB', 30, 'https://plus.yandex.ru', event)" class="flex-shrink-0 text-xs px-3.5 py-2 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 text-white font-medium transition active:scale-95 shadow-sm">Яндекс Плюс</button>

    function resolveLanguage() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlLang = urlParams.get('lang');
      if (urlLang && ['ru', 'be', 'en', 'pl'].includes(urlLang.toLowerCase())) {
        return urlLang.toLowerCase();
      }
      const stored = localStorage.getItem('stoppay_lang');
      if (stored && ['ru', 'be', 'en', 'pl'].includes(stored.toLowerCase())) {
        return stored.toLowerCase();
      }
      if (window.Telegram?.WebApp?.initDataUnsafe?.user?.language_code) {
        const code = window.Telegram.WebApp.initDataUnsafe.user.language_code.toLowerCase();
        if (code.startsWith('be')) return 'be';
        if (code.startsWith('en')) return 'en';
        if (code.startsWith('pl')) return 'pl';
        if (code.startsWith('ru')) return 'ru';
      }
      return 'ru';
    }

    function changeLanguage(lang) {
      if (!I18N[lang]) return;
      if (typeof AudioFX !== 'undefined') AudioFX.click();
      state.lang = lang;
      localStorage.setItem('stoppay_lang', lang);
      updateLanguageUI();
      renderUI();
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    // Web Audio Synthesizer Engine (Subtle Apple-style clicks & chimes)
    const AudioFX = {
      ctx: null,
      enabled: true,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      click() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(2000, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(750, this.ctx.currentTime + 0.03);
          gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.035);
        } catch(e) {}
      },
      chime() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const chords = [1046.5, 1318.5, 1567.98]; // C6, E6, G6
          chords.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            const t = this.ctx.currentTime + idx * 0.06;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.045, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.42);
          });
        } catch(e) {}
      },
      thud() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(120, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.09);
        } catch(e) {}
      }
    };

    // Refined Shimmer Particles System
    class CyberParticleSystem {
      constructor() {
        this.canvas = document.getElementById('particle-canvas');
        if (!this.canvas) return;
        this.ctx = this.canvas.getContext('2d');
        this.particles = [];
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
      }
      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }
      burst(x, y, color = '#2997ff', count = 24) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.5 + Math.random() * 5;
          this.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            size: 2 + Math.random() * 2.5,
            color,
            alpha: 0.9,
            decay: 0.022 + Math.random() * 0.025,
            gravity: 0.1
          });
        }
      }
      loop() {
        if (this.particles.length > 0) {
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
          for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.alpha -= p.decay;
            p.size *= 0.96;

            if (p.alpha <= 0 || p.size <= 0.2) {
              this.particles.splice(i, 1);
              continue;
            }

            this.ctx.save();
            this.ctx.globalAlpha = p.alpha;
            this.ctx.fillStyle = p.color;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.restore();
          }
        }
        requestAnimationFrame(this.loop);
      }
    }

    // 3D Liquid Glass Tilt with Specular Glare Tracking
    function attach3DTilt(card) {
      if (!card || card.dataset.tiltAttached) return;
      card.dataset.tiltAttached = 'true';

      let glare = card.querySelector('.card-glare');
      if (!glare) {
        glare = document.createElement('div');
        glare.className = 'card-glare';
        card.appendChild(glare);
      }

      function handleMove(e) {
        const rect = card.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const dx = (x - cx) / cx;
        const dy = (y - cy) / cy;

        card.style.transform = `perspective(1000px) rotateX(${-dy * 6}deg) rotateY(${dx * 6}deg) translateZ(3px)`;
        glare.style.opacity = '1';
        glare.style.background = `radial-gradient(circle 140px at ${x}px ${y}px, rgba(255,255,255,0.18), transparent 75%)`;
      }

      function handleLeave() {
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
        glare.style.opacity = '0';
      }

      card.addEventListener('mousemove', handleMove, { passive: true });
      card.addEventListener('touchmove', handleMove, { passive: true });
      card.addEventListener('mouseleave', handleLeave);
      card.addEventListener('touchend', handleLeave);
      card.addEventListener('touchcancel', handleLeave);
    }

    function resolveUser() {
      // 1. Telegram WebApp SDK initDataUnsafe
      if (tg?.initDataUnsafe?.user?.id) {
        state.user_id = tg.initDataUnsafe.user.id;
        state.first_name = tg.initDataUnsafe.user.first_name || '';
        return;
      }

      // 2. Raw initData query string
      if (tg?.initData) {
        try {
          const p = new URLSearchParams(tg.initData);
          const uStr = p.get('user');
          if (uStr) {
            const u = JSON.parse(uStr);
            if (u.id) {
              state.user_id = u.id;
              state.first_name = u.first_name || '';
              return;
            }
          }
        } catch(e) {}
      }

      // 3. Telegram WebApp hash (#tgWebAppData=...)
      if (window.location.hash) {
        try {
          const hashParams = new URLSearchParams(window.location.hash.substring(1));
          const tgData = hashParams.get('tgWebAppData');
          if (tgData) {
            const inner = new URLSearchParams(tgData);
            const uStr = inner.get('user');
            if (uStr) {
              const u = JSON.parse(uStr);
              if (u.id) {
                state.user_id = u.id;
                state.first_name = u.first_name || '';
                return;
              }
            }
          }
        } catch(e) {}
      }

      // 4. URL query parameters ?user_id=...&name=...
      const urlParams = new URLSearchParams(window.location.search);
      const urlId = urlParams.get('user_id');
      if (urlId && !isNaN(parseInt(urlId))) {
        state.user_id = parseInt(urlId);
        const urlName = urlParams.get('name');
        if (urlName) state.first_name = decodeURIComponent(urlName);
        return;
      }

      // 5. Saved in localStorage
      const stored = localStorage.getItem('stoppay_user_id');
      if (stored && !isNaN(parseInt(stored))) {
        state.user_id = parseInt(stored);
        const storedName = localStorage.getItem('stoppay_user_name');
        if (storedName) state.first_name = storedName;
        return;
      }
    }

    function fmt(num) {
      return Math.round(num).toLocaleString('ru-RU');

    // Smooth Number Animator
    function animateCounter(el, startVal, endVal, suffix = '') {
      const startTime = performance.now();
      const diff = endVal - startVal;
      const duration = 500;
      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(startVal + diff * ease);
        el.innerText = `${fmt(current)}${suffix}`;
        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          el.innerText = `${fmt(endVal)}${suffix}`;
        }
      }
      requestAnimationFrame(step);
    }

    let prevTotal = 0;
    let prevMonthly = 0;

    // Accurate Monthly Forecast Engine
    function calculateMonthlyForecast() {
      const monthlyTotals = new Array(12).fill(0);
      if (!state.subscriptions || state.subscriptions.length === 0) {
        return monthlyTotals;
      }

      state.subscriptions.forEach(sub => {
        if (!sub.is_active) return;

        // Determine converted price in current target currency
        let convertedPrice = Number(sub.price) || 0;
        if (state.metrics && state.metrics.services) {
          const matched = state.metrics.services.find(
            s => s.name && sub.service_name && s.name.trim().toLowerCase() === sub.service_name.trim().toLowerCase()
          );
          if (matched && matched.annual_cost && sub.period_days > 0) {
            convertedPrice = matched.annual_cost / (365.0 / sub.period_days);
          }
        }

        const periodDays = parseInt(sub.period_days) || 30;

        // Regular monthly subscription (27 - 32 days)
        if (periodDays >= 27 && periodDays <= 32) {
          for (let m = 0; m < 12; m++) {
            monthlyTotals[m] += convertedPrice;
          }
        }
        // Annual subscription (>= 330 days)
        else if (periodDays >= 330) {
          let billingMonth = new Date().getMonth();
          if (sub.next_billing_date) {
            const bDate = new Date(sub.next_billing_date);
            if (!isNaN(bDate.getTime())) {
              billingMonth = bDate.getMonth();
            }
          }
          monthlyTotals[billingMonth] += convertedPrice;
        }
        // Weekly or custom interval
        else {
          const currentYear = new Date().getFullYear();
          let d = sub.next_billing_date ? new Date(sub.next_billing_date) : new Date();
          if (isNaN(d.getTime())) d = new Date();

          const startOfYear = new Date(currentYear, 0, 1);
          const endOfYear = new Date(currentYear, 11, 31, 23, 59, 59);

          const periodMs = Math.max(1, periodDays) * 86400000;
          const diffMs = d.getTime() - startOfYear.getTime();
          const shifts = Math.floor(diffMs / periodMs);
          let simDate = new Date(d.getTime() - shifts * periodMs);

          while (simDate < startOfYear) {
            simDate = new Date(simDate.getTime() + periodMs);
          }
          while (simDate <= endOfYear) {
            const m = simDate.getMonth();
            monthlyTotals[m] += convertedPrice;
            simDate = new Date(simDate.getTime() + periodMs);
          }
        }
      });

      return monthlyTotals;
    }

    function renderDonutChart() {
      const dict = I18N[state.lang] || I18N.ru;
      const sym = CURRENCY_SYMBOLS[state.currency] || state.currency;
      const g = document.getElementById('donut-segments');
      const breakdownEl = document.getElementById('services-breakdown');
      g.innerHTML = '';
      breakdownEl.innerHTML = '';

      const totalEl = document.getElementById('chart-total-amount');
      const monthlyEl = document.getElementById('chart-monthly-avg');
      const badgeEl = document.getElementById('chart-services-badge');

      if (!state.metrics || state.metrics.services_count === 0) {
        totalEl.innerText = `0 ${sym}`;
        monthlyEl.innerText = `0 ${sym} ${dict.per_month_short}`;
        badgeEl.innerText = `0 ${dict.active_word(0)}`;
        breakdownEl.innerHTML = `<div class="col-span-1 sm:col-span-2 text-center text-[#86868b] py-3 text-xs">${dict.no_active_subs}</div>`;
        prevTotal = 0;
        prevMonthly = 0;
        return;
      }

      // Calculate clean monthly and annual sums
      const monthlyTotals = calculateMonthlyForecast();
      const cleanAnnual = monthlyTotals.reduce((a, b) => a + b, 0);
      const cleanMonthly = cleanAnnual / 12.0;

      const total = cleanAnnual > 0 ? cleanAnnual : state.metrics.total_annual;
      const monthly = cleanMonthly > 0 ? cleanMonthly : state.metrics.monthly_avg;
      const count = state.metrics.services_count;
      const services = state.metrics.services;

      animateCounter(totalEl, prevTotal, total, ` ${sym}`);
      animateCounter(monthlyEl, prevMonthly, monthly, ` ${sym} ${dict.per_month_short}`);
      prevTotal = total;
      prevMonthly = monthly;

      badgeEl.innerText = `${count} ${dict.active_word(count)}`;

      const r = 62;
      const circumference = 2 * Math.PI * r;
      let currentOffset = 0;

      services.forEach((s, idx) => {
        const color = APPLE_COLORS[idx % APPLE_COLORS.length];
        const fraction = total > 0 ? (s.annual_cost / total) : 0;
        const dashLength = fraction * circumference;
        const gapLength = circumference - dashLength;
        const pct = Math.round(fraction * 100);

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', '80');
        circle.setAttribute('cy', '80');
        circle.setAttribute('r', r.toString());
        circle.setAttribute('stroke', color);
        circle.setAttribute('stroke-width', '14');
        circle.setAttribute('fill', 'none');
        circle.setAttribute('stroke-dasharray', `${dashLength} ${gapLength}`);
        circle.setAttribute('stroke-dashoffset', (-currentOffset).toString());
        circle.setAttribute('class', 'donut-slice');
        circle.style.color = color;
        g.appendChild(circle);

        currentOffset += dashLength;

        const pill = document.createElement('div');
        pill.className = 'flex items-center space-x-2.5 bg-white/[0.03] p-2.5 rounded-2xl border border-white/[0.05] hover:border-white/15 transition';
        pill.innerHTML = `
          <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color: ${color}"></span>
          <div class="truncate flex-1">
            <div class="text-white font-medium truncate text-xs">${s.name}</div>
            <div class="text-[10px] text-[#86868b]">${fmt(s.annual_cost)} ${sym}${dict.per_year_short} (${pct}%)</div>
          </div>
        `;
        breakdownEl.appendChild(pill);
      });
    }

            daysNotice = `<span class="text-[#ff9f0a] font-bold animate-pulse">${dict.today_excl}</span>`;
          } else {
            const inDaysStr = dict.in_days.replace('{d}', diffDays);
            if (diffDays <= 3) {
              daysNotice = `<span class="text-[#ff9f0a] font-medium">${dateStr} (${inDaysStr})</span>`;
            } else {
              daysNotice = `<span class="text-[#86868b]">${dateStr} (${inDaysStr})</span>`;
            }
          }
        }

        const brandColor = APPLE_COLORS[i % APPLE_COLORS.length];
        const statusLabel = isActive ? dict.active : (dict.paused || 'Пауза');

        card.innerHTML = `
          <div class="card-glare"></div>
          <div class="relative z-10 space-y-3">
            <!-- Top Block: Service Info & Price -->
            <div class="flex items-start justify-between gap-3">
              <div class="flex items-center space-x-3 min-w-0 flex-1">
                <!-- Apple Service Avatar Badge -->
                <div class="w-11 h-11 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-lg font-bold text-white flex-shrink-0 relative" style="box-shadow: 0 0 14px ${brandColor}25">
                  <span style="color: ${brandColor}">${sub.service_name.charAt(0).toUpperCase()}</span>
                  ${isActive ? `<span class="sub-radar-dot w-2 h-2 rounded-full absolute -top-0.5 -right-0.5 bg-[#30d158] radar-pulse"></span>` : ''}
                </div>

                <div class="min-w-0 flex-1">
                  <div class="text-sm sm:text-base font-semibold text-white truncate leading-tight">
                    ${sub.service_name}
                  </div>
                  <div class="text-xs text-[#86868b] mt-1 flex items-center gap-1.5 flex-wrap">
                    ${daysNotice}
                    <span class="text-white/20">•</span>
                    <span>${sub.period_days} ${dict.days_short}</span>
                  </div>
                </div>
              </div>

              <!-- Price & Billing Interval -->
              <div class="text-right flex-shrink-0">
                <div class="text-base sm:text-lg font-bold text-white tracking-tight">
                  ${sub.price} ${sym}
                </div>
                <div class="text-[10px] text-[#86868b] font-medium">
                  ${sub.period_days >= 330 ? dict.per_year_short : dict.per_month_short}
                </div>
              </div>
            </div>

            <!-- Subtle Divider -->
            <div class="h-px bg-white/[0.06] w-full"></div>

            <!-- Bottom Actions Row: Status Toggle + Action Buttons -->
            <div class="flex items-center justify-between gap-2 pt-0.5">
              <!-- Left: iOS Toggle Switch with Label -->
              <label class="inline-flex items-center gap-2 cursor-pointer select-none py-1">
                <input type="checkbox" ${isActive ? 'checked' : ''} onchange="toggleSub(${sub.id}, this, event)" class="sr-only cyber-toggle">
                <div class="cyber-toggle-track w-10 h-5 bg-[#262629] rounded-full transition-all duration-300 relative border border-white/10 flex-shrink-0">
                  <div class="cyber-toggle-thumb absolute top-[1px] left-[1px] bg-white rounded-full h-4 w-4 transition-all duration-300 shadow-sm"></div>
                </div>
                <span class="sub-status-label text-xs font-medium ${isActive ? 'text-[#30d158]' : 'text-white/40'}">
                  ${statusLabel}
                </span>
              </label>

              <!-- Right: Buttons Group (Renew + Cancel URL + Delete) -->
              <div class="flex items-center gap-1.5 flex-shrink-0">
                <!-- Renew Button -->
                <button onclick="renewSub(${sub.id}, event)" title="${dict.renew}" class="flex items-center space-x-1 px-3 py-1.5 rounded-xl bg-white/5 hover:bg-[#30d158]/20 border border-white/10 hover:border-[#30d158]/30 text-white/90 hover:text-[#30d158] transition text-xs font-semibold active:scale-95">
                  <span class="text-xs">🔄</span>
                  <span>${dict.renew}</span>
                </button>

                <!-- Cancel URL Link (if provided) -->
                ${sub.cancel_url ? `
                  <a href="${sub.cancel_url}" target="_blank" onclick="event.stopPropagation()" title="${dict.cancel_short}" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-xl bg-white/5 hover:bg-[#0071e3]/20 border border-white/10 hover:border-[#0071e3]/30 text-[#2997ff] transition text-xs font-semibold active:scale-95">
                    <span>↗</span>
                    <span class="hidden xs:inline">${dict.cancel_short}</span>
                  </a>
                ` : ''}

                <!-- Delete Button -->
                <button onclick="deleteSub(${sub.id}, event)" title="${dict.confirm_delete}" class="w-8 h-8 rounded-xl bg-white/5 hover:bg-[#ff453a]/20 border border-white/10 hover:border-[#ff453a]/30 text-[#86868b] hover:text-[#ff453a] flex items-center justify-center transition text-xs font-bold active:scale-95">
                  ✕
                </button>
              </div>
            </div>
          </div>
        `;

        attach3DTilt(card);
        container.appendChild(card);
      });
    }

    async function renewSub(subId, event) {
      const dict = I18N[state.lang] || I18N.ru;
      AudioFX.click();
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

      if (particleSystem && event) {
        const x = event.clientX || window.innerWidth / 2;
        const y = event.clientY || window.innerHeight / 2;
        particleSystem.burst(x, y, '#30d158', 25);
      }

      try {
        const res = await fetch(`/api/subscriptions/${subId}/renew`, { method: 'POST' });
        const resData = await res.json();
        if (resData.status === 'ok') {
          showToast(dict.toast_sub_renewed, '🔄');
          loadData();
        } else {
          showToast(resData.message || 'Error', '⚠️');
        }
      } catch (e) {
        console.error('Failed to renew:', e);
      }
    }

    async function toggleSub(subId, checkbox, event) {
      const dict = I18N[state.lang] || I18N.ru;
      AudioFX.thud();
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      if (checkbox.checked && particleSystem && event) {
        const x = event.clientX || window.innerWidth / 2;
        const y = event.clientY || window.innerHeight / 2;
        particleSystem.burst(x, y, '#30d158', 20);
      }

      const card = checkbox.closest('.glass-card');
      const statusLabel = checkbox.closest('label')?.querySelector('.sub-status-label');
      if (statusLabel) {
        statusLabel.innerText = checkbox.checked ? dict.active : (dict.paused || 'Пауза');
        statusLabel.className = 'sub-status-label text-xs font-medium ' + (checkbox.checked ? 'text-[#30d158]' : 'text-white/40');
      }
      if (card) {
        if (checkbox.checked) {
          card.classList.remove('opacity-65');
        } else {
          card.classList.add('opacity-65');
        }
      }

      const sub = state.subscriptions.find(s => s.id === subId);
      if (sub) {
        sub.is_active = checkbox.checked;
        showToast(checkbox.checked ? dict.toast_sub_active : dict.toast_sub_paused);
      }

      try {
        const res = await fetch(`/api/subscriptions/${subId}/toggle`, { method: 'POST' });
        const resData = await res.json();
        if (resData.status === 'ok') {
          loadData();
        }
      } catch (e) {
        console.error('Failed to toggle:', e);
      }
    }

    async function deleteSub(subId, event) {
      const dict = I18N[state.lang] || I18N.ru;
      AudioFX.thud();
      if (!confirm(dict.confirm_delete)) return;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');

      if (particleSystem && event) {
        const x = event.clientX || window.innerWidth / 2;
        const y = event.clientY || window.innerHeight / 2;
        particleSystem.burst(x, y, '#ff453a', 25);
      }

      try {
        await fetch(`/api/subscriptions/${subId}`, { method: 'DELETE' });
        showToast(dict.toast_sub_deleted, '✕');
        loadData();
      } catch (e) {
        console.error('Failed to delete:', e);
      }
    }

    // Modal Sheet Handlers
    function openAddModal(event) {
      AudioFX.click();
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

      if (particleSystem && event) {
        const x = event.clientX || window.innerWidth / 2;
        const y = event.clientY || window.innerHeight / 2;
        particleSystem.burst(x, y, '#2997ff', 16);
      }

      const overlay = document.getElementById('add-modal-overlay');
      const content = document.getElementById('add-modal-content');
      overlay.classList.remove('hidden');
      setTimeout(() => {
        overlay.classList.remove('opacity-0');
        content.classList.remove('hidden-sheet');
        document.getElementById('form-name').focus();
      }, 10);
    }

    function closeAddModal(e) {
      if (e && e.target !== e.currentTarget && e.target.tagName !== 'BUTTON') return;
      AudioFX.click();
      const overlay = document.getElementById('add-modal-overlay');
      const content = document.getElementById('add-modal-content');
      content.classList.add('hidden-sheet');
      overlay.classList.add('opacity-0');
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 300);
    }

    function setFormCurrency(curr) {
      AudioFX.click();
      document.getElementById('form-currency').value = curr;
      document.querySelectorAll('.form-curr-pill').forEach(btn => {
        btn.className = 'form-curr-pill py-2 rounded-lg text-xs font-medium transition text-white/60 hover:text-white';
      });
      const activeBtn = document.getElementById('f-curr-' + curr);
      if (activeBtn) {
        activeBtn.className = 'form-curr-pill py-2 rounded-lg text-xs font-bold transition bg-[#0071e3] text-white shadow-sm';
      }
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function setFormPeriod(days) {
      AudioFX.click();
      document.getElementById('form-period').value = days;
      document.querySelectorAll('.period-chip').forEach(btn => {
        btn.className = 'period-chip py-2 text-xs rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 text-white font-medium transition active:scale-95 text-center';
      });
      const chipMap = { 7: 'i18n-chip-7d', 30: 'i18n-chip-30d', 90: 'i18n-chip-90d', 365: 'i18n-chip-1yr' };
      const targetId = chipMap[days];
      if (targetId) {
        const el = document.getElementById(targetId);
        if (el) el.className = 'period-chip py-2 text-xs rounded-xl bg-[#0071e3]/20 border border-[#0071e3]/40 text-[#2997ff] font-semibold transition active:scale-95 text-center';
      }
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    // Direct input watcher for form-period
    document.addEventListener('DOMContentLoaded', () => {
      const periodInput = document.getElementById('form-period');
      if (periodInput) {
        periodInput.addEventListener('input', (e) => {
          const val = parseInt(e.target.value);
          document.querySelectorAll('.period-chip').forEach(btn => {
            btn.className = 'period-chip py-2 text-xs rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 text-white font-medium transition active:scale-95 text-center';
          });
          const chipMap = { 7: 'i18n-chip-7d', 30: 'i18n-chip-30d', 90: 'i18n-chip-90d', 365: 'i18n-chip-1yr' };
          const targetId = chipMap[val];
          if (targetId) {
            const el = document.getElementById(targetId);
            if (el) el.className = 'period-chip py-2 text-xs rounded-xl bg-[#0071e3]/20 border border-[#0071e3]/40 text-[#2997ff] font-semibold transition active:scale-95 text-center';
          }
        });
      }
    });

    function setOffsetDate(daysOffset) {
      AudioFX.click();
      const d = new Date();
      d.setDate(d.getDate() + daysOffset);
      const iso = d.toISOString().split('T')[0];
      document.getElementById('form-date').value = iso;

      document.querySelectorAll('.date-chip').forEach(btn => {
        btn.classList.remove('bg-[#0071e3]/20', 'border-[#0071e3]/40', 'text-white');
        btn.classList.add('bg-white/5', 'text-[#2997ff]');
      });
      const offsetMap = { 0: 'i18n-date-today', 30: 'i18n-date-30d', 365: 'i18n-date-1yr' };
      const targetId = offsetMap[daysOffset];
      if (targetId) {
        const el = document.getElementById(targetId);
        if (el) {
          el.classList.remove('bg-white/5');
          el.classList.add('bg-[#0071e3]/20', 'border-[#0071e3]/40', 'text-white');
        }
      }

      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function applyPreset(name, price, curr, period, url, event) {
      AudioFX.click();
      document.getElementById('form-name').value = name;
      document.getElementById('form-price').value = price;
      setFormCurrency(curr);
      setFormPeriod(period);
      document.getElementById('form-url').value = url;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      if (particleSystem && event) {
        const x = event.clientX || window.innerWidth / 2;
        const y = event.clientY || window.innerHeight / 2;
        particleSystem.burst(x, y, '#af52de', 18);
      }
    }

    async function submitNewSub(e) {
      e.preventDefault();
      const dict = I18N[state.lang] || I18N.ru;
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = dict.saving;

      const payload = {
        user_id: state.user_id,
        username: state.first_name || 'User',
        service_name: document.getElementById('form-name').value.trim(),
        price: parseFloat(document.getElementById('form-price').value.replace(',', '.')),
        currency: document.getElementById('form-currency').value,
        period_days: parseInt(document.getElementById('form-period').value),
        next_billing_date: document.getElementById('form-date').value,
        cancel_url: document.getElementById('form-url').value.trim() || null,
      };

      try {
        const res = await fetch('/api/subscriptions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const resData = await res.json();
        if (resData.status === 'ok') {
          AudioFX.chime();
          showToast(dict.toast_sub_saved, '✓');
          
          if (particleSystem) {
            particleSystem.burst(window.innerWidth / 2, window.innerHeight / 2, '#30d158', 35);
          }

          closeAddModal();
          document.getElementById('add-sub-form').reset();
          setFormPeriod(30);
          setOffsetDate(30);
          await loadData();
          switchTab('subscriptions');
        } else {
          alert('Error: ' + (resData.message || 'Failed'));
        }
      } catch (err) {
        alert('Network error');
      } finally {
        btn.disabled = false;
        btn.innerText = dict.save_sub;
      }
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
