<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StopPay  — Подписки</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            apple: {
              black: '#000000',
              card: '#121215',
              surface: '#1c1c1e',
              elevated: '#242428',
              blue: '#0071e3',
              blueLight: '#2997ff',
              green: '#30d158',
              orange: '#ff9f0a',
              purple: '#af52de',
              pink: '#ff375f',
              yellow: '#ffd60a',
              red: '#ff453a',
              gray: '#86868b',
              grayLight: '#d2d2d7',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    
    html, body {
      background-color: #000000;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh;
    }

    input, button, select, textarea {
      font-size: 16px; /* Prevents mobile browser zoom */
    }

    /* Apple.com Cinematic Ambient Lighting */
    .ambient-aurora {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .aurora-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.28;
      will-change: transform;
    }
    .orb-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #0071e3 0%, rgba(41, 151, 255, 0.4) 60%, transparent 85%);
      top: -100px;
      left: 15%;
      animation: appleFloat1 18s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, #af52de 0%, rgba(94, 92, 230, 0.3) 65%, transparent 85%);
      top: 35%;
      right: -100px;
      animation: appleFloat2 22s ease-in-out infinite alternate;
    }
    .orb-3 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #30d158 0%, rgba(0, 113, 227, 0.3) 70%, transparent 85%);
      bottom: 0%;
      left: -80px;
      animation: appleFloat3 20s ease-in-out infinite alternate;
    }

    @keyframes appleFloat1 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 60px) scale(1.12); }
      100% { transform: translate(-30px, 90px) scale(0.96); }
    }
    @keyframes appleFloat2 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-50px, -40px) scale(1.15); }
      100% { transform: translate(30px, 45px) scale(1); }
    }
    @keyframes appleFloat3 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, -50px) scale(1.1); }
      100% { transform: translate(-30px, 30px) scale(0.95); }
    }

    /* Particle Canvas */
    #particle-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 60;
    }

    /* Apple.com Liquid Glass Card */
    .glass-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.06) 0%, rgba(18, 18, 22, 0.8) 45%, rgba(10, 10, 12, 0.95) 100%);
      backdrop-filter: blur(35px) saturate(190%);
      -webkit-backdrop-filter: blur(35px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.65), inset 0 1px 1px 0 rgba(255, 255, 255, 0.22), inset 0 -1px 1px 0 rgba(0, 0, 0, 0.5);
      border-radius: 26px;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease;
      will-change: transform;
    }
    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 0 25px 55px -10px rgba(0, 0, 0, 0.75), 0 0 25px -5px rgba(41, 151, 255, 0.2), inset 0 1px 1px 0 rgba(255, 255, 255, 0.35);
    }

    /* Apple Specular Reflection Glare */
    .card-glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.35s ease;
      z-index: 10;
      mix-blend-mode: overlay;
    }

    /* Apple Header Bar */
    .glass-header {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    /* Apple Floating Dock */
    .glass-dock {
      background: rgba(24, 24, 28, 0.82);
      backdrop-filter: blur(36px) saturate(200%);
      -webkit-backdrop-filter: blur(36px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.25);
    }

    .donut-slice {
      transition: stroke-dasharray 0.85s cubic-bezier(0.16, 1, 0.3, 1), stroke-dashoffset 0.85s cubic-bezier(0.16, 1, 0.3, 1);
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
    }

    /* Dynamic Island Pill */
    #dynamic-toast {
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
    }
    #dynamic-toast.toast-hidden {
      transform: translate(-50%, -140%) scale(0.88);
      opacity: 0;
      pointer-events: none;
    }

    /* Sheet Modal */
    .sheet-modal {
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }
    .sheet-modal.hidden-sheet {
      transform: translateY(105%);
      opacity: 0;
      pointer-events: none;
    }

    /* Radar Ping Indicator */
    .radar-pulse {
      position: relative;
    }
    .radar-pulse::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: inherit;
      opacity: 0.7;
      animation: radarPing 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes radarPing {
      75%, 100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    /* Apple-Style Toggle Switch */
    .cyber-toggle:checked + .cyber-toggle-track {
      background-color: #30d158;
      box-shadow: 0 0 12px rgba(48, 209, 88, 0.45);
    }
    .cyber-toggle:checked + .cyber-toggle-track .cyber-toggle-thumb {
      transform: translateX(20px);
      background-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    /* Apple Dock Active Tab Pill */
    .dock-pill {
      transition: all 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>
</head>

<body class="min-h-screen bg-black text-[#f5f5f7] flex flex-col pb-32 overflow-x-hidden selection:bg-[#0071e3] selection:text-white">

  <!-- Apple Cinematic Ambient Lighting -->
  <div class="ambient-aurora">
    <div class="aurora-orb orb-1"></div>
    <div class="aurora-orb orb-2"></div>
    <div class="aurora-orb orb-3"></div>
  </div>

  <!-- Interactive Particles Canvas -->
  <canvas id="particle-canvas"></canvas>

  <!-- Apple Dynamic Island Toast -->
  <div id="dynamic-toast" class="toast-hidden fixed top-3 left-1/2 -translate-x-1/2 z-50 flex items-center space-x-2 px-4 py-2 rounded-full bg-[#1c1c1e]/90 text-white border border-white/15 shadow-[0_8px_30px_rgba(0,0,0,0.6)] text-xs font-semibold">
    <span id="toast-icon" class="w-4 h-4 rounded-full bg-[#30d158]/20 text-[#30d158] flex items-center justify-center text-xs font-bold">✓</span>
    <span id="toast-message" class="tracking-tight text-white/90">Успешно</span>
  </div>

  <!-- Apple Top Navigation Bar -->
  <header class="sticky top-0 z-40 glass-header px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-xl bg-white/10 border border-white/15 flex items-center justify-center shadow-sm">
        <span class="text-base text-white leading-none font-semibold"></span>
      </div>
      <div>
        <div class="text-sm font-bold tracking-tight text-white">
          <span>StopPay</span>
        </div>
        <div id="user-badge" class="text-[11px] font-normal text-[#86868b] truncate max-w-[140px]">Личный кабинет</div>
      </div>
    </div>

    <!-- Header Actions: Sound Toggle + Currency Switcher -->
    <div class="flex items-center space-x-2">
      <!-- Sound FX Toggle -->
      <button onclick="toggleSound()" id="sound-toggle-btn" title="Звук интерфейса" class="w-8 h-8 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-center text-sm text-white/70 transition active:scale-95">
        <span id="sound-icon">🔊</span>
      </button>

      <!-- Currency Selector Segmented Glass Bar -->
      <div class="flex items-center bg-[#1c1c1e]/90 p-0.5 rounded-xl border border-white/10 text-[11px] font-medium shadow-inner">
        <button onclick="changeCurrency('RUB')" id="curr-btn-RUB" class="curr-pill px-2.5 py-1 rounded-lg transition bg-white/20 text-white font-semibold shadow-sm">₽</button>
        <button onclick="changeCurrency('BYN')" id="curr-btn-BYN" class="curr-pill px-2.5 py-1 rounded-lg transition text-white/50 hover:text-white">Br</button>
        <button onclick="changeCurrency('USD')" id="curr-btn-USD" class="curr-pill px-2.5 py-1 rounded-lg transition text-white/50 hover:text-white">$</button>
        <button onclick="changeCurrency('PLN')" id="curr-btn-PLN" class="curr-pill px-2.5 py-1 rounded-lg transition text-white/50 hover:text-white">zł</button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="relative z-10 flex-1 max-w-lg mx-auto w-full px-4 pt-4 space-y-4">

    <!-- TAB 1: ANALYTICS / OVERVIEW -->
    <section id="view-analytics" class="space-y-4">

      <!-- Apple Card Donut Overview Widget -->
      <div class="glass-card p-6 text-center relative group">
        <div class="card-glare"></div>

        <div class="relative z-10">
          <div class="flex items-center justify-between mb-2 px-1">
            <div class="text-[10px] font-bold text-[#86868b] tracking-[0.2em] uppercase">
              В С Е Г О   В   Г О Д
            </div>
            <div class="flex items-center space-x-1.5 text-[10px] font-medium text-[#30d158] bg-[#30d158]/10 px-2 py-0.5 rounded-full border border-[#30d158]/25">
              <span class="w-1.5 h-1.5 rounded-full bg-[#30d158] radar-pulse"></span>
              <span>Активно</span>
            </div>
          </div>

          <!-- SVG Donut Chart with Center Display -->
          <div class="relative w-52 h-52 mx-auto my-3 flex items-center justify-center">
            
            <svg viewBox="0 0 160 160" class="w-full h-full -rotate-90">
              <circle cx="80" cy="80" r="62" stroke="rgba(255, 255, 255, 0.06)" stroke-width="14" fill="none" />
              <g id="donut-segments"></g>
            </svg>

            <!-- Holographic Center Hub -->
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none px-2 text-center">
              <span id="chart-total-amount" class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
                0 ₽
              </span>
              <span id="chart-monthly-avg" class="text-xs text-[#86868b] mt-0.5 font-medium tracking-normal">
                0 ₽ / мес
              </span>
              <div id="chart-services-badge" class="mt-2 text-[10px] font-semibold px-2.5 py-0.5 rounded-full bg-white/10 text-white/90 border border-white/10">
                0 активных
              </div>
            </div>
          </div>

          <!-- Distribution breakdown pills -->
          <div id="services-breakdown" class="mt-5 pt-4 border-t border-white/[0.08] grid grid-cols-2 gap-2 text-left text-xs">
          </div>
        </div>
      </div>

      <!-- Monthly Spend Bar Chart -->
      <div class="glass-card p-5 relative group">
        <div class="card-glare"></div>
        <div class="relative z-10">
          <div class="flex items-center justify-between mb-3">
            <div>
              <div class="text-[10px] font-bold text-[#86868b] tracking-wider uppercase">Календарь списаний</div>
              <div id="monthly-forecast-title" class="text-sm font-bold text-white">В этом месяце: 0 ₽</div>
            </div>
            <span id="monthly-forecast-badge" class="text-xs font-semibold text-[#30d158] bg-[#30d158]/10 border border-[#30d158]/20 px-2.5 py-0.5 rounded-full flex items-center space-x-1">
              <span>В норме</span>
            </span>
          </div>

          <div id="monthly-bars" class="h-28 flex items-end justify-between gap-1.5 pt-4 pb-2 px-1">
          </div>
          <div class="flex justify-between text-[10px] text-[#86868b] font-medium px-1 mt-1">
            <span id="m-lbl-0">Янв</span><span id="m-lbl-1">Фев</span><span id="m-lbl-2">Мар</span><span id="m-lbl-3">Апр</span><span id="m-lbl-4">Май</span><span id="m-lbl-5">Июн</span><span id="m-lbl-6">Июл</span><span id="m-lbl-7">Авг</span><span id="m-lbl-8">Сен</span><span id="m-lbl-9">Окт</span><span id="m-lbl-10">Ноя</span><span id="m-lbl-11">Дек</span>
          </div>
        </div>
      </div>

    </section>

    <!-- TAB 2: SUBSCRIPTIONS LIST -->
    <section id="view-subscriptions" class="hidden space-y-3">
      <div class="flex items-center justify-between px-1">
        <div>
          <div class="text-[10px] font-bold text-[#86868b] tracking-wider uppercase">Управление</div>
          <h2 class="text-base font-bold text-white">Ваши подписки</h2>
        </div>
        <button onclick="openAddModal(event)" class="flex items-center space-x-1.5 text-xs font-semibold text-white bg-[#0071e3] hover:bg-[#0077ed] px-3.5 py-1.5 rounded-full transition shadow-md active:scale-95">
          <span class="text-base leading-none">＋</span>
          <span>Добавить</span>
        </button>
      </div>

      <!-- Dynamic Subscriptions Container -->
      <div id="subs-list-container" class="space-y-2.5">
      </div>
    </section>

  </main>

  <!-- Bottom Floating Capsule Dock (Apple Style) -->
  <nav class="fixed bottom-4 inset-x-4 max-w-sm mx-auto z-40">
    <div class="glass-dock rounded-full p-1.5 shadow-2xl flex items-center justify-around relative">
      <button onclick="switchTab('analytics')" id="nav-analytics" class="dock-pill flex-1 flex flex-col items-center py-2 rounded-full transition text-white bg-white/15 font-semibold">
        <span class="text-base leading-none">📊</span>
        <span class="text-[10px] mt-1">Обзор</span>
      </button>

      <button onclick="switchTab('subscriptions')" id="nav-subscriptions" class="dock-pill flex-1 flex flex-col items-center py-2 rounded-full transition text-white/50 hover:text-white font-medium">
        <span class="text-base leading-none">📋</span>
        <span class="text-[10px] mt-1">Подписки</span>
      </button>

      <button onclick="openAddModal(event)" class="dock-pill flex-1 flex flex-col items-center py-2 rounded-full transition text-[#2997ff] font-semibold active:scale-95 hover:text-white">
        <span class="text-base leading-none font-bold">＋</span>
        <span class="text-[10px] mt-1">Создать</span>
      </button>
    </div>
  </nav>

  <!-- Add Subscription Bottom Sheet Modal -->
  <div id="add-modal-overlay" onclick="closeAddModal(event)" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden opacity-0 transition-opacity duration-300">
    <div onclick="event.stopPropagation()" id="add-modal-content" class="sheet-modal hidden-sheet w-full max-w-md bg-[#141418] border-t sm:border border-white/15 rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto pb-12">
      
      <!-- Sheet Handle -->
      <div class="w-10 h-1 bg-white/20 rounded-full mx-auto sm:hidden mb-2"></div>

      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <h3 class="text-base font-bold text-white">Новая подписка</h3>
        </div>
        <button type="button" onclick="closeAddModal()" class="w-8 h-8 rounded-full bg-white/10 text-white/70 hover:text-white flex items-center justify-center text-sm transition">✕</button>
      </div>

      <!-- Quick Preset Chips -->
      <div>
        <div class="text-[10px] text-[#86868b] uppercase font-bold tracking-wider mb-2">Быстрый выбор</div>
        <div class="flex flex-wrap gap-1.5">
          <button type="button" onclick="applyPreset('Яндекс Плюс', 299, 'RUB', 30, 'https://plus.yandex.ru', event)" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition active:scale-95">Яндекс Плюс</button>
          <button type="button" onclick="applyPreset('Telegram Premium', 399, 'RUB', 30, 'https://telegram.org', event)" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition active:scale-95">TG Premium</button>
          <button type="button" onclick="applyPreset('Spotify', 19.99, 'PLN', 30, 'https://spotify.com/account', event)" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition active:scale-95">Spotify</button>
          <button type="button" onclick="applyPreset('Netflix', 14.99, 'USD', 30, 'https://netflix.com/cancel', event)" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition active:scale-95">Netflix</button>
          <button type="button" onclick="applyPreset('YouTube Premium', 13.99, 'USD', 30, 'https://youtube.com/paid_memberships', event)" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition active:scale-95">YouTube</button>
          <button type="button" onclick="applyPreset('iCloud+', 149, 'RUB', 30, 'https://appleid.apple.com', event)" class="text-xs px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-white transition active:scale-95">iCloud+</button>
        </div>
      </div>

      <!-- Form with Smooth Keyboard Support -->
      <form id="add-sub-form" onsubmit="submitNewSub(event)" class="space-y-4">
        
        <!-- Service Name -->
        <div>
          <label class="block text-[11px] text-[#86868b] uppercase font-bold tracking-wider mb-1.5">Название сервиса</label>
          <input type="text" id="form-name" required placeholder="Например: Netflix, Кинопоиск..." class="w-full bg-[#1c1c20] border border-white/15 rounded-xl px-3.5 py-2.5 text-base text-white placeholder-white/25 focus:outline-none focus:border-[#0071e3] transition">
        </div>

        <!-- Price and Currency Row -->
        <div class="grid grid-cols-2 gap-3 items-end">
          <div>
            <label class="block text-[11px] text-[#86868b] uppercase font-bold tracking-wider mb-1.5">Стоимость</label>
            <input type="text" inputmode="decimal" id="form-price" required placeholder="299" class="w-full bg-[#1c1c20] border border-white/15 rounded-xl px-3.5 py-2.5 text-base text-white placeholder-white/25 focus:outline-none focus:border-[#0071e3] transition">
          </div>

          <div>
            <label class="block text-[11px] text-[#86868b] uppercase font-bold tracking-wider mb-1.5">Валюта</label>
            <div class="grid grid-cols-4 gap-1 bg-[#1c1c20] border border-white/15 p-1 rounded-xl">
              <button type="button" onclick="setFormCurrency('RUB')" id="f-curr-RUB" class="form-curr-pill py-1.5 rounded-lg text-xs font-bold transition bg-[#0071e3] text-white">₽</button>
              <button type="button" onclick="setFormCurrency('BYN')" id="f-curr-BYN" class="form-curr-pill py-1.5 rounded-lg text-xs font-medium transition text-white/60 hover:text-white">Br</button>
              <button type="button" onclick="setFormCurrency('USD')" id="f-curr-USD" class="form-curr-pill py-1.5 rounded-lg text-xs font-medium transition text-white/60 hover:text-white">$</button>
              <button type="button" onclick="setFormCurrency('PLN')" id="f-curr-PLN" class="form-curr-pill py-1.5 rounded-lg text-xs font-medium transition text-white/60 hover:text-white">zł</button>
            </div>
            <input type="hidden" id="form-currency" value="RUB">
          </div>
        </div>

        <!-- Period Row with Direct Keyboard Input and Quick Buttons -->
        <div>
          <label class="block text-[11px] text-[#86868b] uppercase font-bold tracking-wider mb-1.5">Период списания (дней)</label>
          <div class="flex items-center space-x-2">
            <input type="number" id="form-period" value="30" min="1" max="3650" required class="w-28 bg-[#1c1c20] border border-white/15 rounded-xl px-3 py-2 text-center text-base text-white focus:outline-none focus:border-[#0071e3] transition">
            <div class="flex-1 flex gap-1.5">
              <button type="button" onclick="setFormPeriod(30)" class="flex-1 py-2 text-xs rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 text-white font-medium transition">30 дн.</button>
              <button type="button" onclick="setFormPeriod(365)" class="flex-1 py-2 text-xs rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 text-white font-medium transition">1 год</button>
              <button type="button" onclick="setFormPeriod(7)" class="flex-1 py-2 text-xs rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 text-white font-medium transition">7 дн.</button>
            </div>
          </div>
        </div>

        <!-- Next Billing Date with Quick Buttons -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-[11px] text-[#86868b] uppercase font-bold tracking-wider">Дата списания</label>
            <div class="flex space-x-2">
              <button type="button" onclick="setOffsetDate(0)" class="text-[11px] text-[#2997ff] hover:underline">Сегодня</button>
              <button type="button" onclick="setOffsetDate(30)" class="text-[11px] text-[#2997ff] hover:underline">+30 дн.</button>
              <button type="button" onclick="setOffsetDate(365)" class="text-[11px] text-[#2997ff] hover:underline">+1 год</button>
            </div>
          </div>
          <input type="date" id="form-date" required class="w-full bg-[#1c1c20] border border-white/15 rounded-xl px-3.5 py-2.5 text-base text-white focus:outline-none focus:border-[#0071e3] transition cursor-pointer">
        </div>

        <!-- Cancellation URL -->
        <div>
          <label class="block text-[11px] text-[#86868b] uppercase font-bold tracking-wider mb-1.5">Ссылка на отмену (опционально)</label>
          <input type="url" id="form-url" placeholder="https://service.com/cancel" class="w-full bg-[#1c1c20] border border-white/15 rounded-xl px-3.5 py-2.5 text-base text-white placeholder-white/25 focus:outline-none focus:border-[#0071e3] transition">
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-[#0071e3] hover:bg-[#0077ed] text-white font-semibold py-3.5 rounded-xl transition text-base flex items-center justify-center space-x-2 mt-2 shadow-lg shadow-[#0071e3]/20 active:scale-[0.99]">
          <span>Сохранить подписку</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    // State
    const state = {
      user_id: null,
      first_name: '',
      currency: 'RUB',
      activeTab: 'analytics',
      subscriptions: [],
      metrics: null
    };

    // Refined Apple Card Colors
    const APPLE_COLORS = ['#2997ff', '#30d158', '#ff9f0a', '#bf5af2', '#ff375f', '#ffd60a', '#64d2ff'];
    const CURRENCY_SYMBOLS = { RUB: '₽', BYN: 'Br', USD: '$', PLN: 'zł' };

    const MONTH_NAMES = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
    const MONTH_FULL_NAMES = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

    const tg = window.Telegram?.WebApp;

    // Web Audio Synthesizer Engine (Subtle Apple-style clicks & chimes)
    const AudioFX = {
      ctx: null,
      enabled: true,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      click() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(2000, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(750, this.ctx.currentTime + 0.03);
          gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.035);
        } catch(e) {}
      },
      chime() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const chords = [1046.5, 1318.5, 1567.98]; // C6, E6, G6
          chords.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            const t = this.ctx.currentTime + idx * 0.06;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.045, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.42);
          });
        } catch(e) {}
      },
      thud() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(120, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.09);
        } catch(e) {}
      }
    };

    function toggleSound() {
      AudioFX.enabled = !AudioFX.enabled;
      document.getElementById('sound-icon').innerText = AudioFX.enabled ? '🔊' : '🔇';
      if (AudioFX.enabled) {
        AudioFX.click();
        showToast('Звук включен');
      } else {
        showToast('Звук отключен');
      }
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    // Refined Shimmer Particles System
    class CyberParticleSystem {
      constructor() {
        this.canvas = document.getElementById('particle-canvas');
        if (!this.canvas) return;
        this.ctx = this.canvas.getContext('2d');
        this.particles = [];
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
      }
      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }
      burst(x, y, color = '#2997ff', count = 24) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.5 + Math.random() * 5;
          this.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            size: 2 + Math.random() * 2.5,
            color,
            alpha: 0.9,
            decay: 0.022 + Math.random() * 0.025,
            gravity: 0.1
          });
        }
      }
      loop() {
        if (this.particles.length > 0) {
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
          for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.alpha -= p.decay;
            p.size *= 0.96;

            if (p.alpha <= 0 || p.size <= 0.2) {
              this.particles.splice(i, 1);
              continue;
            }

            this.ctx.save();
            this.ctx.globalAlpha = p.alpha;
            this.ctx.fillStyle = p.color;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.restore();
          }
        }
        requestAnimationFrame(this.loop);
      }
    }

    let particleSystem = null;

    // 3D Liquid Glass Tilt with Specular Glare Tracking
    function attach3DTilt(card) {
      if (!card || card.dataset.tiltAttached) return;
      card.dataset.tiltAttached = 'true';

      let glare = card.querySelector('.card-glare');
      if (!glare) {
        glare = document.createElement('div');
        glare.className = 'card-glare';
        card.appendChild(glare);
      }

      function handleMove(e) {
        const rect = card.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const dx = (x - cx) / cx;
        const dy = (y - cy) / cy;

        card.style.transform = `perspective(1000px) rotateX(${-dy * 6}deg) rotateY(${dx * 6}deg) translateZ(3px)`;
        glare.style.opacity = '1';
        glare.style.background = `radial-gradient(circle 140px at ${x}px ${y}px, rgba(255,255,255,0.18), transparent 75%)`;
      }

      function handleLeave() {
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
        glare.style.opacity = '0';
      }

      card.addEventListener('mousemove', handleMove, { passive: true });
      card.addEventListener('touchmove', handleMove, { passive: true });
      card.addEventListener('mouseleave', handleLeave);
      card.addEventListener('touchend', handleLeave);
      card.addEventListener('touchcancel', handleLeave);
    }

    function resolveUser() {
      // 1. Telegram WebApp SDK initDataUnsafe
      if (tg?.initDataUnsafe?.user?.id) {
        state.user_id = tg.initDataUnsafe.user.id;
        state.first_name = tg.initDataUnsafe.user.first_name || '';
        return;
      }

      // 2. Raw initData query string
      if (tg?.initData) {
        try {
          const p = new URLSearchParams(tg.initData);
          const uStr = p.get('user');
          if (uStr) {
            const u = JSON.parse(uStr);
            if (u.id) {
              state.user_id = u.id;
              state.first_name = u.first_name || '';
              return;
            }
          }
        } catch(e) {}
      }

      // 3. Telegram WebApp hash (#tgWebAppData=...)
      if (window.location.hash) {
        try {
          const hashParams = new URLSearchParams(window.location.hash.substring(1));
          const tgData = hashParams.get('tgWebAppData');
          if (tgData) {
            const inner = new URLSearchParams(tgData);
            const uStr = inner.get('user');
            if (uStr) {
              const u = JSON.parse(uStr);
              if (u.id) {
                state.user_id = u.id;
                state.first_name = u.first_name || '';
                return;
              }
            }
          }
        } catch(e) {}
      }

      // 4. URL query parameters ?user_id=...&name=...
      const urlParams = new URLSearchParams(window.location.search);
      const urlId = urlParams.get('user_id');
      if (urlId && !isNaN(parseInt(urlId))) {
        state.user_id = parseInt(urlId);
        const urlName = urlParams.get('name');
        if (urlName) state.first_name = decodeURIComponent(urlName);
        return;
      }

      // 5. Saved in localStorage
      const stored = localStorage.getItem('stoppay_user_id');
      if (stored && !isNaN(parseInt(stored))) {
        state.user_id = parseInt(stored);
        const storedName = localStorage.getItem('stoppay_user_name');
        if (storedName) state.first_name = storedName;
        return;
      }
    }

    function initApp() {
      particleSystem = new CyberParticleSystem();

      if (tg) {
        try {
          tg.ready();
          tg.expand();
          tg.setHeaderColor('#000000');
          tg.setBackgroundColor('#000000');
          tg.enableClosingConfirmation();
        } catch(e) {}
      }

      resolveUser();

      if (state.user_id) {
        localStorage.setItem('stoppay_user_id', state.user_id);
        if (state.first_name) localStorage.setItem('stoppay_user_name', state.first_name);
      }

      updateUserBadge();
      setOffsetDate(30);

      // Attach 3D tilt to all static glass cards
      document.querySelectorAll('.glass-card').forEach(attach3DTilt);

      loadData();
    }

    function updateUserBadge() {
      const badge = document.getElementById('user-badge');
      if (state.first_name) {
        badge.innerText = state.first_name;
      } else {
        badge.innerText = 'Личный кабинет';
      }
    }

    // Dynamic Island Toast Helper
    function showToast(msg, icon = '✓') {
      const toast = document.getElementById('dynamic-toast');
      document.getElementById('toast-message').innerText = msg;
      document.getElementById('toast-icon').innerText = icon;
      toast.classList.remove('toast-hidden');

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }

      setTimeout(() => {
        toast.classList.add('toast-hidden');
      }, 2500);
    }

    // Tab Switching with Apple Spring Physics
    function switchTab(tab) {
      AudioFX.click();
      state.activeTab = tab;
      const vAnalytics = document.getElementById('view-analytics');
      const vSubs = document.getElementById('view-subscriptions');
      const nAnalytics = document.getElementById('nav-analytics');
      const nSubs = document.getElementById('nav-subscriptions');

      if (tab === 'analytics') {
        vAnalytics.classList.remove('hidden');
        vSubs.classList.add('hidden');
        nAnalytics.className = 'dock-pill flex-1 flex flex-col items-center py-2 rounded-full transition text-white bg-white/15 font-semibold';
        nSubs.className = 'dock-pill flex-1 flex flex-col items-center py-2 rounded-full transition text-white/50 hover:text-white font-medium';
      } else {
        vAnalytics.classList.add('hidden');
        vSubs.classList.remove('hidden');
        nSubs.className = 'dock-pill flex-1 flex flex-col items-center py-2 rounded-full transition text-white bg-white/15 font-semibold';
        nAnalytics.className = 'dock-pill flex-1 flex flex-col items-center py-2 rounded-full transition text-white/50 hover:text-white font-medium';
      }

      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    // Currency Switch
    function changeCurrency(curr) {
      AudioFX.click();
      state.currency = curr;
      document.querySelectorAll('.curr-pill').forEach(btn => {
        btn.className = 'curr-pill px-2.5 py-1 rounded-lg transition text-white/50 hover:text-white';
      });
      const activeBtn = document.getElementById('curr-btn-' + curr);
      if (activeBtn) {
        activeBtn.className = 'curr-pill px-2.5 py-1 rounded-lg transition bg-white/20 text-white font-semibold shadow-sm';
      }
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      loadData();
    }

    // Fetch data from real backend REST API
    async function loadData() {
      try {
        let url = `/api/subscriptions?currency=${state.currency}`;
        if (state.user_id) {
          url += `&user_id=${state.user_id}`;
        }
        const res = await fetch(url);
        const data = await res.json();

        if (data.status === 'ok') {
          if (data.user_id && !state.user_id) {
            state.user_id = data.user_id;
            localStorage.setItem('stoppay_user_id', data.user_id);
          }
          state.subscriptions = data.subscriptions || [];
          state.metrics = data.metrics || null;
          updateUserBadge();
          renderUI();
        }
      } catch (e) {
        console.error('Error fetching subscriptions:', e);
      }
    }

    function renderUI() {
      renderDonutChart();
      renderMonthlyBars();
      renderSubscriptionsList();
    }

    function fmt(num) {
      return Math.round(num).toLocaleString('ru-RU');
    }

    // Smooth Number Animator
    function animateCounter(el, startVal, endVal, suffix = '') {
      const startTime = performance.now();
      const diff = endVal - startVal;
      const duration = 500;
      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(startVal + diff * ease);
        el.innerText = `${fmt(current)}${suffix}`;
        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          el.innerText = `${fmt(endVal)}${suffix}`;
        }
      }
      requestAnimationFrame(step);
    }

    let prevTotal = 0;
    let prevMonthly = 0;

    // Accurate Monthly Forecast Engine
    function calculateMonthlyForecast() {
      const monthlyTotals = new Array(12).fill(0);
      if (!state.subscriptions || state.subscriptions.length === 0) {
        return monthlyTotals;
      }

      state.subscriptions.forEach(sub => {
        if (!sub.is_active) return;

        // Determine converted price in current target currency
        let convertedPrice = Number(sub.price) || 0;
        if (state.metrics && state.metrics.services) {
          const matched = state.metrics.services.find(
            s => s.name && sub.service_name && s.name.trim().toLowerCase() === sub.service_name.trim().toLowerCase()
          );
          if (matched && matched.annual_cost && sub.period_days > 0) {
            convertedPrice = matched.annual_cost / (365.0 / sub.period_days);
          }
        }

        const periodDays = parseInt(sub.period_days) || 30;

        // Regular monthly subscription (27 - 32 days)
        if (periodDays >= 27 && periodDays <= 32) {
          for (let m = 0; m < 12; m++) {
            monthlyTotals[m] += convertedPrice;
          }
        }
        // Annual subscription (>= 330 days)
        else if (periodDays >= 330) {
          let billingMonth = new Date().getMonth();
          if (sub.next_billing_date) {
            const bDate = new Date(sub.next_billing_date);
            if (!isNaN(bDate.getTime())) {
              billingMonth = bDate.getMonth();
            }
          }
          monthlyTotals[billingMonth] += convertedPrice;
        }
        // Weekly or custom interval
        else {
          const currentYear = new Date().getFullYear();
          let d = sub.next_billing_date ? new Date(sub.next_billing_date) : new Date();
          if (isNaN(d.getTime())) d = new Date();

          const startOfYear = new Date(currentYear, 0, 1);
          const endOfYear = new Date(currentYear, 11, 31, 23, 59, 59);

          const periodMs = Math.max(1, periodDays) * 86400000;
          const diffMs = d.getTime() - startOfYear.getTime();
          const shifts = Math.floor(diffMs / periodMs);
          let simDate = new Date(d.getTime() - shifts * periodMs);

          while (simDate < startOfYear) {
            simDate = new Date(simDate.getTime() + periodMs);
          }
          while (simDate <= endOfYear) {
            const m = simDate.getMonth();
            monthlyTotals[m] += convertedPrice;
            simDate = new Date(simDate.getTime() + periodMs);
          }
        }
      });

      return monthlyTotals;
    }

    function renderDonutChart() {
      const sym = CURRENCY_SYMBOLS[state.currency] || state.currency;
      const g = document.getElementById('donut-segments');
      const breakdownEl = document.getElementById('services-breakdown');
      g.innerHTML = '';
      breakdownEl.innerHTML = '';

      const totalEl = document.getElementById('chart-total-amount');
      const monthlyEl = document.getElementById('chart-monthly-avg');
      const badgeEl = document.getElementById('chart-services-badge');

      if (!state.metrics || state.metrics.services_count === 0) {
        totalEl.innerText = `0 ${sym}`;
        monthlyEl.innerText = `0 ${sym} / мес`;
        badgeEl.innerText = '0 активных';
        breakdownEl.innerHTML = '<div class="col-span-2 text-center text-[#86868b] py-3 text-xs">Нет активных подписок</div>';
        prevTotal = 0;
        prevMonthly = 0;
        return;
      }

      // Calculate clean monthly and annual sums
      const monthlyTotals = calculateMonthlyForecast();
      const cleanAnnual = monthlyTotals.reduce((a, b) => a + b, 0);
      const cleanMonthly = cleanAnnual / 12.0;

      const total = cleanAnnual > 0 ? cleanAnnual : state.metrics.total_annual;
      const monthly = cleanMonthly > 0 ? cleanMonthly : state.metrics.monthly_avg;
      const count = state.metrics.services_count;
      const services = state.metrics.services;

      animateCounter(totalEl, prevTotal, total, ` ${sym}`);
      animateCounter(monthlyEl, prevMonthly, monthly, ` ${sym} / мес`);
      prevTotal = total;
      prevMonthly = monthly;

      badgeEl.innerText = `${count} ${pluralizeSubs(count)}`;

      const r = 62;
      const circumference = 2 * Math.PI * r;
      let currentOffset = 0;

      services.forEach((s, idx) => {
        const color = APPLE_COLORS[idx % APPLE_COLORS.length];
        const fraction = total > 0 ? (s.annual_cost / total) : 0;
        const dashLength = fraction * circumference;
        const gapLength = circumference - dashLength;
        const pct = Math.round(fraction * 100);

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', '80');
        circle.setAttribute('cy', '80');
        circle.setAttribute('r', r.toString());
        circle.setAttribute('stroke', color);
        circle.setAttribute('stroke-width', '14');
        circle.setAttribute('fill', 'none');
        circle.setAttribute('stroke-dasharray', `${dashLength} ${gapLength}`);
        circle.setAttribute('stroke-dashoffset', (-currentOffset).toString());
        circle.setAttribute('class', 'donut-slice');
        circle.style.color = color;
        g.appendChild(circle);

        currentOffset += dashLength;

        const pill = document.createElement('div');
        pill.className = 'flex items-center space-x-2.5 bg-white/[0.03] p-2.5 rounded-2xl border border-white/[0.05] hover:border-white/15 transition';
        pill.innerHTML = `
          <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color: ${color}"></span>
          <div class="truncate flex-1">
            <div class="text-white font-medium truncate text-xs">${s.name}</div>
            <div class="text-[10px] text-[#86868b]">${fmt(s.annual_cost)} ${sym}/год (${pct}%)</div>
          </div>
        `;
        breakdownEl.appendChild(pill);
      });
    }

    function pluralizeSubs(n) {
      if (n % 10 === 1 && n % 100 !== 11) return 'активная';
      return 'активных';
    }

    function renderMonthlyBars() {
      const container = document.getElementById('monthly-bars');
      container.innerHTML = '';
      const sym = CURRENCY_SYMBOLS[state.currency] || state.currency;
      const currentMonth = new Date().getMonth();
      const monthlyTotals = calculateMonthlyForecast();

      const currentMonthVal = monthlyTotals[currentMonth];
      const titleEl = document.getElementById('monthly-forecast-title');
      if (titleEl) {
        titleEl.innerText = `В этом месяце: ${fmt(currentMonthVal)} ${sym}`;
      }

      const maxVal = Math.max(...monthlyTotals, 0);

      for (let m = 0; m < 12; m++) {
        const isCurrent = (m === currentMonth);
        const val = monthlyTotals[m];
        const heightPct = maxVal > 0 ? Math.max(14, Math.round((val / maxVal) * 86)) : 12;

        const col = document.createElement('div');
        col.className = 'flex-1 h-full flex items-end justify-center group relative cursor-pointer';
        
        const barColor = isCurrent
          ? 'bg-[#0071e3] shadow-[0_0_12px_rgba(0,113,227,0.5)]'
          : 'bg-white/15 hover:bg-white/30';

        col.innerHTML = `
          <div class="w-full ${barColor} rounded-full transition-all duration-300" style="height: ${heightPct}%"></div>
          <div class="absolute -top-7 opacity-0 group-hover:opacity-100 transition-opacity bg-[#1c1c1e] text-white text-[10px] font-medium px-2 py-0.5 rounded-lg border border-white/15 pointer-events-none whitespace-nowrap z-20 shadow-md">
            ${fmt(val)} ${sym}
          </div>
        `;

        col.addEventListener('click', () => {
          AudioFX.click();
          if (titleEl) {
            titleEl.innerText = `${MONTH_FULL_NAMES[m]}: ${fmt(val)} ${sym}`;
          }
          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        const lblEl = document.getElementById(`m-lbl-${m}`);
        if (lblEl) {
          if (isCurrent) {
            lblEl.className = 'text-[#2997ff] font-bold';
          } else {
            lblEl.className = 'text-[#86868b] font-medium';
          }
        }

        container.appendChild(col);
      }
    }

    function renderSubscriptionsList() {
      const container = document.getElementById('subs-list-container');
      container.innerHTML = '';

      if (state.subscriptions.length === 0) {
        container.innerHTML = `
          <div class="glass-card p-8 text-center space-y-3">
            <div class="w-12 h-12 mx-auto rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-2xl">
              💳
            </div>
            <div class="text-sm font-semibold text-white">Список подписок пуст</div>
            <div class="text-xs text-[#86868b] max-w-xs mx-auto leading-relaxed">Добавьте ваши регулярные сервисы, чтобы бот предупреждал о списаниях за 24 часа.</div>
            <button onclick="openAddModal(event)" class="bg-[#0071e3] text-white text-xs px-5 py-2 rounded-full font-medium transition mt-2 shadow-sm active:scale-95">
              ＋ Добавить подписку
            </button>
          </div>
        `;
        return;
      }

      state.subscriptions.forEach((sub, i) => {
        const sym = CURRENCY_SYMBOLS[sub.currency] || sub.currency;
        const isActive = sub.is_active;
        const card = document.createElement('div');
        card.className = `glass-card p-4 transition ${isActive ? '' : 'opacity-60'}`;

        let daysNotice = '';
        if (sub.next_billing_date) {
          const bDate = new Date(sub.next_billing_date);
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          bDate.setHours(0, 0, 0, 0);
          const diffDays = Math.round((bDate - today) / (1000 * 60 * 60 * 24));

          const dateStr = bDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
          if (diffDays < 0) {
            daysNotice = `<span class="text-[#ff453a] font-medium">${dateStr} (просрочено)</span>`;
          } else if (diffDays === 0) {
            daysNotice = `<span class="text-[#ff9f0a] font-bold animate-pulse">Сегодня!</span>`;
          } else if (diffDays <= 3) {
            daysNotice = `<span class="text-[#ff9f0a] font-medium">${dateStr} (через ${diffDays} дн.)</span>`;
          } else {
            daysNotice = `<span class="text-[#86868b]">${dateStr} (через ${diffDays} дн.)</span>`;
          }
        }

        const cancelBtn = sub.cancel_url
          ? `<a href="${sub.cancel_url}" target="_blank" onclick="event.stopPropagation()" class="text-[11px] text-[#2997ff] hover:underline flex items-center space-x-0.5"><span>↗ Отменить</span></a>`
          : '';

        const brandColor = APPLE_COLORS[i % APPLE_COLORS.length];

        card.innerHTML = `
          <div class="card-glare"></div>
          <div class="relative z-10 flex items-center justify-between">
            <div class="flex items-center space-x-3 truncate">
              
              <!-- Apple Service Avatar Badge -->
              <div class="w-10 h-10 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-base font-bold text-white flex-shrink-0 relative" style="box-shadow: 0 0 12px ${brandColor}22">
                <span style="color: ${brandColor}">${sub.service_name.charAt(0).toUpperCase()}</span>
                ${isActive ? `<span class="w-2 h-2 rounded-full absolute -top-0.5 -right-0.5 bg-[#30d158] radar-pulse"></span>` : ''}
              </div>

              <div class="truncate">
                <div class="text-sm font-semibold text-white truncate flex items-center space-x-1.5">
                  <span>${sub.service_name}</span>
                  ${sub.cancel_url ? cancelBtn : ''}
                </div>
                <div class="text-[11px] mt-0.5">
                  ${daysNotice}
                </div>
              </div>
            </div>

            <div class="flex items-center space-x-3 flex-shrink-0">
              <div class="text-right">
                <div class="text-sm font-bold text-white">${sub.price} ${sym}</div>
                <div class="text-[10px] text-[#86868b]">${sub.period_days} дн.</div>
              </div>

              <!-- Apple iOS Toggle Switch -->
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" ${isActive ? 'checked' : ''} onchange="toggleSub(${sub.id}, this, event)" class="sr-only cyber-toggle">
                <div class="cyber-toggle-track w-11 h-6 bg-[#262629] rounded-full transition-all duration-300 relative border border-white/10">
                  <div class="cyber-toggle-thumb absolute top-[2px] left-[2px] bg-white rounded-full h-5 w-5 transition-all duration-300 shadow-sm"></div>
                </div>
              </label>

              <button onclick="deleteSub(${sub.id}, event)" class="w-7 h-7 rounded-full bg-white/5 hover:bg-[#ff453a]/20 text-[#86868b] hover:text-[#ff453a] flex items-center justify-center transition text-xs active:scale-90">
                ✕
              </button>
            </div>
          </div>
        `;

        attach3DTilt(card);
        container.appendChild(card);
      });
    }

    async function toggleSub(subId, checkbox, event) {
      AudioFX.thud();
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      if (checkbox.checked && particleSystem && event) {
        const x = event.clientX || window.innerWidth / 2;
        const y = event.clientY || window.innerHeight / 2;
        particleSystem.burst(x, y, '#30d158', 20);
      }

      const sub = state.subscriptions.find(s => s.id === subId);
      if (sub) {
        sub.is_active = checkbox.checked;
        showToast(checkbox.checked ? 'Подписка активна' : 'Подписка на паузе');
      }

      try {
        const res = await fetch(`/api/subscriptions/${subId}/toggle`, { method: 'POST' });
        const resData = await res.json();
        if (resData.status === 'ok') {
          loadData();
        }
      } catch (e) {
        console.error('Failed to toggle:', e);
      }
    }

    async function deleteSub(subId, event) {
      AudioFX.thud();
      if (!confirm('Удалить эту подписку?')) return;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');

      if (particleSystem && event) {
        const x = event.clientX || window.innerWidth / 2;
        const y = event.clientY || window.innerHeight / 2;
        particleSystem.burst(x, y, '#ff453a', 25);
      }

      try {
        await fetch(`/api/subscriptions/${subId}`, { method: 'DELETE' });
        showToast('Подписка удалена', '✕');
        loadData();
      } catch (e) {
        console.error('Failed to delete:', e);
      }
    }

    // Modal Sheet Handlers
    function openAddModal(event) {
      AudioFX.click();
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

      if (particleSystem && event) {
        const x = event.clientX || window.innerWidth / 2;
        const y = event.clientY || window.innerHeight / 2;
        particleSystem.burst(x, y, '#2997ff', 16);
      }

      const overlay = document.getElementById('add-modal-overlay');
      const content = document.getElementById('add-modal-content');
      overlay.classList.remove('hidden');
      setTimeout(() => {
        overlay.classList.remove('opacity-0');
        content.classList.remove('hidden-sheet');
        document.getElementById('form-name').focus();
      }, 10);
    }

    function closeAddModal(e) {
      if (e && e.target !== e.currentTarget && e.target.tagName !== 'BUTTON') return;
      AudioFX.click();
      const overlay = document.getElementById('add-modal-overlay');
      const content = document.getElementById('add-modal-content');
      content.classList.add('hidden-sheet');
      overlay.classList.add('opacity-0');
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 300);
    }

    function setFormCurrency(curr) {
      AudioFX.click();
      document.getElementById('form-currency').value = curr;
      document.querySelectorAll('.form-curr-pill').forEach(btn => {
        btn.className = 'form-curr-pill py-1.5 rounded-lg text-xs font-medium transition text-white/60 hover:text-white';
      });
      const activeBtn = document.getElementById('f-curr-' + curr);
      if (activeBtn) {
        activeBtn.className = 'form-curr-pill py-1.5 rounded-lg text-xs font-bold transition bg-[#0071e3] text-white shadow-sm';
      }
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function setFormPeriod(days) {
      AudioFX.click();
      document.getElementById('form-period').value = days;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function setOffsetDate(daysOffset) {
      AudioFX.click();
      const d = new Date();
      d.setDate(d.getDate() + daysOffset);
      const iso = d.toISOString().split('T')[0];
      document.getElementById('form-date').value = iso;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function applyPreset(name, price, curr, period, url, event) {
      AudioFX.click();
      document.getElementById('form-name').value = name;
      document.getElementById('form-price').value = price;
      setFormCurrency(curr);
      setFormPeriod(period);
      document.getElementById('form-url').value = url;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      if (particleSystem && event) {
        const x = event.clientX || window.innerWidth / 2;
        const y = event.clientY || window.innerHeight / 2;
        particleSystem.burst(x, y, '#af52de', 18);
      }
    }

    async function submitNewSub(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = 'Сохранение...';

      const payload = {
        user_id: state.user_id,
        username: state.first_name || 'User',
        service_name: document.getElementById('form-name').value.trim(),
        price: parseFloat(document.getElementById('form-price').value.replace(',', '.')),
        currency: document.getElementById('form-currency').value,
        period_days: parseInt(document.getElementById('form-period').value),
        next_billing_date: document.getElementById('form-date').value,
        cancel_url: document.getElementById('form-url').value.trim() || null,
      };

      try {
        const res = await fetch('/api/subscriptions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const resData = await res.json();
        if (resData.status === 'ok') {
          AudioFX.chime();
          showToast('Подписка сохранена', '✓');
          
          if (particleSystem) {
            particleSystem.burst(window.innerWidth / 2, window.innerHeight / 2, '#30d158', 35);
          }

          closeAddModal();
          document.getElementById('add-sub-form').reset();
          setFormPeriod(30);
          setOffsetDate(30);
          await loadData();
          switchTab('subscriptions');
        } else {
          alert('Ошибка: ' + (resData.message || 'Не удалось сохранить'));
        }
      } catch (err) {
        alert('Ошибка связи с сервером');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Сохранить подписку';
      }
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
